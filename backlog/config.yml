project_name: ".github"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Parked", "Done"]
definition_of_done:
  - "actionlint (from the repo root; the same lint ci.yml runs via .github/workflows/actionlint.yml)"
  - "zizmor .github/workflows/ .github/actions/ (the security audit ci.yml runs via .github/workflows/zizmor.yml)"
  - "For a change to a reusable workflow's INPUTS or PERMISSIONS: check the callers across the fleet, not just this repo — `gh search code --owner rknightion 'uses: rknightion/.github'`"
labels: []
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
zero_padded_ids: 4
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "ghc"
