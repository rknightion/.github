# Self-CI: dogfood our own reusable security checks against this repo's workflows.
# Runs on PRs (so Renovate's action-bump PRs get a green gate before automerge) and on
# pushes to main. Calls the local reusables by ./ path so they always test the current ref.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  actionlint:
    permissions:
      contents: read
    uses: ./.github/workflows/actionlint.yml

  zizmor:
    permissions:
      contents: read
      security-events: write # upload SARIF
      actions: read # match the reusable's declared job permissions (else startup_failure)
    uses: ./.github/workflows/zizmor.yml
    with:
      enforce: true

  # CodeQL's `actions` language analyses our workflows themselves (dataflow), complementing
  # actionlint (correctness) + zizmor (policy). Permissions mirror the reusable's analyze job.
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: ./.github/workflows/codeql.yml
    with:
      languages: '[{"language":"actions","build-mode":"none"}]'

  # This repo's own task surface. `just check` is the complete local gate
  # (fmt-check + lint + test + pii-check); this job is what makes it enforced
  # rather than aspirational. setup: true installs the pinned actionlint and
  # zizmor into .tools/ on the runner.
  just:
    permissions:
      contents: read
    uses: ./.github/workflows/just-check.yml
    with:
      setup: true

  # A pull request that closes an issue shows evidence for each of its acceptance criteria. Checks
  # only pull requests with a closing keyword (enforce-all-prs: false), because this repository takes
  # bot pull requests. Remote pinned form on purpose: a `./` call would run the checker from the pull
  # request's own head. Check run: `ac-evidence / Acceptance evidence`.
  ac-evidence:
    # The reusable fails on any event but pull_request; on a push to main this job is skipped.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: rknightion/.github/.github/workflows/ac-evidence.yml@8f00b7fb896191e598f12ed565395697c539add1 # v1.26.9
    with:
      enforce-all-prs: false

  # The lines a pull request adds carry no identifier, email address, public address or credential
  # shape. Remote pinned form on purpose, like ac-evidence: this repo is public, and a `./` call
  # would take the sweep's own rules from the pull request head, so a pull request could loosen the
  # check it is judged by. The reusable fails on any event but pull_request. Check run:
  # `privacy-sweep / Privacy sweep`.
  privacy-sweep:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/privacy-sweep.yml@8f00b7fb896191e598f12ed565395697c539add1 # v1.26.9

  # The Backlog.md board is retired: issues are the queue. A pull request may delete files under
  # backlog/ or move them out, never add or change one there. Reads the file list from the API, so
  # no pull request code is checked out.
  backlog-freeze:
    name: backlog/ is frozen
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Refuse additions and changes under backlog/
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$CHANGED_FILES" =~ ^[0-9]+$ ]]; then
            echo "::error title=backlog freeze::the pull request number or file count is malformed"
            exit 1
          fi
          # The pull request files API lists at most 3000 files; refuse rather than check part of a change.
          if (( CHANGED_FILES > 3000 )); then
            echo "::error title=backlog freeze::${CHANGED_FILES} changed files is more than the API lists; split the pull request"
            exit 1
          fi
          offending="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | select(.status != "removed") | select(.filename | startswith("backlog/")) | "\(.status) \(.filename | @json)"')"
          if [[ -n "$offending" ]]; then
            echo "::error title=backlog freeze::this pull request adds or changes files under backlog/; the board is retired, so file the work as an issue"
            printf '  %s\n' "$offending"
            exit 1
          fi
          echo "No file under backlog/ is added or changed."

  # Single aggregator the branch ruleset gates on (`ci-success` required status check). Keeping the
  # ruleset pinned to one check means the job list above can change without touching branch
  # protection. This is what lets Renovate platform-automerge action bumps once they go green.
  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    if: always()
    needs: [actionlint, zizmor, codeql, just, ac-evidence, privacy-sweep, backlog-freeze]
    steps:
      - name: Fail if any required job did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
        run: |
          echo "A required job failed or was cancelled: ${RESULTS}"
          exit 1
      # A skipped job reports success, so on a pull request the pull request checks must have
      # actually run and passed. Off a pull request they must have been skipped.
      - name: Fail if a pull request check did not run
        if: ${{ github.event_name == 'pull_request' }}
        env:
          AC_EVIDENCE: ${{ needs.ac-evidence.result }}
          PRIVACY_SWEEP: ${{ needs.privacy-sweep.result }}
          BACKLOG_FREEZE: ${{ needs.backlog-freeze.result }}
        run: |
          if [[ "$AC_EVIDENCE" != "success" || "$PRIVACY_SWEEP" != "success" || "$BACKLOG_FREEZE" != "success" ]]; then
            echo "ac-evidence: ${AC_EVIDENCE}, privacy-sweep: ${PRIVACY_SWEEP}, backlog-freeze: ${BACKLOG_FREEZE}; all must pass on a pull request"
            exit 1
          fi
      - name: Fail if a pull request check ran off a pull request
        if: ${{ github.event_name != 'pull_request' }}
        env:
          AC_EVIDENCE: ${{ needs.ac-evidence.result }}
          PRIVACY_SWEEP: ${{ needs.privacy-sweep.result }}
          BACKLOG_FREEZE: ${{ needs.backlog-freeze.result }}
        run: |
          if [[ "$AC_EVIDENCE" != "skipped" || "$PRIVACY_SWEEP" != "skipped" || "$BACKLOG_FREEZE" != "skipped" ]]; then
            echo "ac-evidence: ${AC_EVIDENCE}, privacy-sweep: ${PRIVACY_SWEEP}, backlog-freeze: ${BACKLOG_FREEZE}; all must be skipped off a pull request"
            exit 1
          fi
      - name: All required jobs passed
        run: echo "ci-success — ${{ join(needs.*.result, ', ') }}"
