# Self-CI: dogfood our own reusable security checks against this repo's workflows.
# Runs on PRs (so Renovate's action-bump PRs get a green gate before automerge) and on
# pushes to main. Calls the local reusables by ./ path so they always test the current ref.
name: ci

on:
  push:
    branches: [main]
  pull_request: {}

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  actionlint:
    permissions:
      contents: read
    uses: ./.github/workflows/actionlint.yml

  zizmor:
    permissions:
      contents: read
      security-events: write # upload SARIF
      actions: read # match the reusable's declared job permissions (else startup_failure)
    uses: ./.github/workflows/zizmor.yml

  # CodeQL's `actions` language analyses our workflows themselves (dataflow), complementing
  # actionlint (correctness) + zizmor (policy). Permissions mirror the reusable's analyze job.
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: ./.github/workflows/codeql.yml
    with:
      languages: '[{"language":"actions","build-mode":"none"}]'

  # Single aggregator the branch ruleset gates on (`ci-success` required status check). Keeping the
  # ruleset pinned to one check means the job list above can change without touching branch
  # protection. This is what lets Renovate platform-automerge action bumps once they go green.
  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    if: always()
    needs: [actionlint, zizmor, codeql]
    steps:
      - name: Fail if any required job did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A required job failed or was cancelled: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: All required jobs passed
        run: echo "ci-success — ${{ join(needs.*.result, ', ') }}"
