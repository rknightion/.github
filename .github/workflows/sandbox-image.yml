# Build and publish the shared Grafana Assistant sandbox toolchain image,
# ghcr.io/rknightion/assistant-sandbox-tools, from sandbox/Dockerfile.
#
# The vended .grafana/Dockerfile (vended/grafana/Dockerfile) copies /opt/sandbox out of this
# image by digest. A pull request builds the image without pushing it; a push to main publishes
# the tags `main` and `sha-<commit>` with a build-provenance attestation. Renovate then bumps
# the digest in vended/grafana/Dockerfile and vend-sync carries it to every enrolled repository.
# linux/arm64 only, built natively: Grafana sandboxes are ARM64.
name: sandbox-image

on:
  push:
    branches: [main]
    paths:
      - "sandbox/**"
      - ".github/workflows/sandbox-image.yml"
  pull_request:
    paths:
      - "sandbox/**"
      - ".github/workflows/sandbox-image.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sandbox-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/rknightion/assistant-sandbox-tools

jobs:
  build:
    name: build (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sandbox
          platforms: linux/arm64
          push: false

  publish:
    name: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # attestation signing
      attestations: write # store the provenance attestation
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sandbox
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Report the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "Published ${IMAGE}:main@${DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
