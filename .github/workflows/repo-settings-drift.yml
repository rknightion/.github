# Fleet repo-settings drift. Reports only; it never writes a setting.
#
# The standard is DERIVED from the majority rather than declared in a file, so
# a deliberate fleet-wide change needs no edit here — move 13 repos and the
# standard follows. The trade is that a majority which drifts together is
# invisible to this check, which is why it reports for a human rather than
# enforcing.
#
# Enforcement (writing settings back) is deliberately NOT here. It needs a
# token carrying `administration: write` on every public repo, which is a far
# broader grant than anything else in this org currently holds, and a bug in an
# enforcer with that grant could disable branch protection fleet-wide. That is
# a decision to take explicitly, not a side effect of adding a workflow.
name: repo-settings-drift

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: repo-settings-drift
  cancel-in-progress: false

jobs:
  drift:
    name: report settings drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reading rulesets and security_and_analysis needs repo administration
      # scope, which GITHUB_TOKEN does not carry cross-repo. Without this the
      # script sees every ruleset as absent and reports the whole fleet as
      # drifted -- a false positive, not a silent pass.
      - name: Mint a fleet read token
        id: token
        uses: ./.github/actions/broker-token
        with:
          # administration:read + metadata:read, installation-scoped, nothing
          # else. Provisioned 2026-08-29: permission set fleet-settings-read,
          # policy gha-fleet-settings-read, JWT role fleet-settings-read pinned
          # to this repo on refs/heads/main. The set deliberately does NOT
          # enumerate repositories -- see the policy comment for why an
          # enumerated list would silently reduce audit coverage.
          permission-set: fleet-settings-read

      - name: Report drift
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: ./fleet/collect-repo-settings.py --out /tmp/audit.json

      - name: Upload the audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo-settings-audit
          path: /tmp/audit.json
          retention-days: 30
