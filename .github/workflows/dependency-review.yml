name: dependency-review (reusable)

# Reusable dependency review: scans dependency-manifest changes in a PR and flags
# newly introduced known-vulnerable packages. PR-only (needs the base/head diff).

on:
  workflow_call: {}

permissions: {}

# Cancel a superseded run on the same ref (PR updates) to free runners. Unique group
# prefix per reusable so a caller invoking several reusables doesn't put them in one
# group where they'd cancel each other.
concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Scope: on a pull request, read the PR file list through the API (no checkout) and skip the
      # heavy steps when no dependency manifest or lockfile changed. The job still runs and reports, so a
      # required check stays satisfied. Fails closed: no gh, an API error, or a list that is
      # truncated (the API caps it at 3000 files) or does not match changed_files all run the full
      # check. push, schedule and dispatch runs are always complete.
      - name: Scope (skip when no dependency manifest or lockfile changed)
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          RELEVANT: '(^|/)(package(-lock)?\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|bun\.lockb?|requirements[^/]*\.(txt|in)|constraints\.txt|Pipfile(\.lock)?|poetry\.lock|pyproject\.toml|uv\.lock|pdm\.lock|setup\.(py|cfg)|environment\.ya?ml|go\.(mod|sum|work)|Cargo\.(toml|lock)|pom\.xml|build\.gradle(\.kts)?|settings\.gradle(\.kts)?|gradle\.lockfile|libs\.versions\.toml|build\.sbt|Gemfile(\.lock)?|[^/]*\.gemspec|composer\.(json|lock)|[^/]*\.(csproj|fsproj|vbproj|sln|nuspec)|packages\.(config|lock\.json)|Directory\.(Packages|Build)\.(props|targets)|paket\.(dependencies|lock)|Package(\.resolved|\.swift)|Podfile(\.lock)?|Cartfile(\.resolved)?|pubspec\.(ya?ml|lock)|mix\.(exs|lock)|rebar\.config|project\.clj|deps\.edn|vcpkg\.json|conanfile\.(txt|py)|Dockerfile[^/]*|[^/]*\.dockerfile|docker-compose[^/]*\.ya?ml|compose[^/]*\.ya?ml|[^/]*\.tf|\.terraform\.lock\.hcl|action\.ya?ml)$|^\.github/(workflows|actions)/|^\.github/dependabot\.ya?ml$'
        run: |
          set -uo pipefail
          full() { echo "Running the full check: $1"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$EVENT" = pull_request ] || full "not a pull_request run"
          command -v gh >/dev/null 2>&1 || full "gh is not available"
          [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$CHANGED_FILES" =~ ^[0-9]+$ ]] || full "pull request metadata is missing"
          [ "$CHANGED_FILES" -lt 3000 ] || full "the file list is capped at 3000 files"
          listing=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | "\(.filename)\t\(.previous_filename // "")"') || full "the file list could not be read"
          count=$(printf '%s' "$listing" | grep -c '' || true)
          [ "$count" -eq "$CHANGED_FILES" ] || full "listed $count files, expected $CHANGED_FILES"
          if printf '%s\n' "$listing" | tr '\t' '\n' | grep -Eq "$RELEVANT"; then
            full "a relevant file changed"
          fi
          echo "No dependency manifest or lockfile changed in this pull request: skipping the check."
          echo "run=false" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: ${{ steps.scope.outputs.run == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        if: ${{ steps.scope.outputs.run == 'true' }}
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # Posting a PR comment needs pull-requests: write, which fork PRs don't
          # get — skip the comment for fork PRs so the review still runs (and
          # still fails on high-severity) without erroring on the comment call.
          comment-summary-in-pr: ${{ (github.event.pull_request.head.repo.full_name == github.repository) && 'on-failure' || 'never' }}
          fail-on-severity: high
