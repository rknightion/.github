# This hub's OWN caller for the arm-automerge reusable it publishes.
#
# It cannot live at .github/workflows/arm-automerge.yml -- that path IS the
# reusable. Hence the distinct filename.
#
# The hub publishes no artefacts of its own (consumers pin its reusables by SHA),
# so it gets no auto-rc prerelease channel and no ghcr-cleanup.
name: self-arm-automerge

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  arm:
    # Quoted: the label text contains ": ", which YAML would otherwise parse as
    # a nested mapping rather than part of the expression.
    if: "github.event.label.name == 'release: ready'"
    permissions:
      contents: write      # enabling auto-merge writes the merge ref
      pull-requests: write # gh pr merge --auto operates on the PR
    # `./` so it always tests the current ref, matching how ci.yml calls the
    # other reusables here.
    uses: ./.github/workflows/arm-automerge.yml
