name: Container publish (reusable)

# Reusable container build/publish for the rknightion fleet. ONE pipeline for both
# edge (push to main) and release (release-please workflow_call) — docker/metadata-action
# decides the tags. Uniform behaviour for every repo regardless of language:
#   * per-arch NATIVE runners (amd64 + arm64), push-by-digest, manifest-list merge
#     (no QEMU — emulated arm64 mis-resolves native wheels/libs)
#   * cosign keyless signing + build-provenance attestation on the merged index (attestation optional via the provenance input)
#   * SBOM (SPDX + CycloneDX) via syft; attached to the GitHub Release on a release
#   * optional Helm chart publish (OCI) — release version or main snapshot
#   * Trivy scan -> caller Security tab (SARIF upload optional via trivy-upload-sarif; the gate always runs)
# Callers trigger on push:main (edge) + release-please workflow_call (release) +
# workflow_dispatch + merge_group (build-only gate). Concurrency cancels superseded
# EDGE builds but never a release publish.

on:
  workflow_call:
    inputs:
      release-tag:
        description: "Release tag (vX.Y.Z) when invoked by release-please; empty for edge builds"
        type: string
        default: ""
      checkout-ref:
        description: "Trusted caller-selected ref for checkout; use a commit SHA to pin the tree. Empty uses the release tag or event ref."
        type: string
        default: ""
      image-licenses:
        description: "OCI licences label: empty keeps the licence the GitHub API reports for the repository at run time; an SPDX expression sets that value; 'dockerfile' drops the API value so the checked-out Dockerfile's own org.opencontainers.image.licenses LABEL stands (declare it there)"
        type: string
        default: ""
      publish-branch-tags-on-prerelease:
        description: "Publish branch-derived tags on hyphenated release tags; set false to publish only version tags"
        type: boolean
        default: true
      image-name:
        description: "Image repository under ghcr.io/<owner>; empty publishes <owner>/<repo>"
        type: string
        default: ""
      dockerfile:
        description: "Path to the Dockerfile"
        type: string
        default: "Dockerfile"
      context:
        description: "Build context"
        type: string
        default: "."
      build-args:
        description: "Newline-separated build args"
        type: string
        default: ""
      helm-chart-path:
        description: "Path to a Helm chart dir to publish (empty = skip)"
        type: string
        default: ""
      charts-repo:
        description: "OCI repo for Helm charts (default ghcr.io/<owner>/charts)"
        type: string
        default: ""
      sbom:
        description: "Generate SBOM (SPDX + CycloneDX)"
        type: boolean
        default: true
      sign:
        description: "Cosign keyless sign the image (and chart)"
        type: boolean
        default: true
      trivy:
        description: "Run Trivy scan and upload SARIF"
        type: boolean
        default: true
      trivy-ignore-file:
        description: "Path to a reviewed Trivy YAML ignore file; empty accepts nothing"
        type: string
        default: ""
      trivy-ignore-unfixed:
        description: "Ignore Trivy vulnerabilities without a fix available for the scanned distribution; filtered findings are also omitted from SARIF"
        type: boolean
        default: false
      trivy-upload-sarif:
        description: "Upload the Trivy SARIF to code scanning; set false on a private repository whose plan has no code scanning, the HIGH/CRITICAL gate still runs"
        type: boolean
        default: true
      provenance:
        description: "Generate a GitHub build-provenance attestation (private repositories need a plan that allows attestations; cosign signing is unaffected)"
        type: boolean
        default: true
      dockerhub-login:
        description: "Log in to Docker Hub for base-image pulls (needs DOCKERHUB_* secrets)"
        type: boolean
        default: false
      otel-tracing:
        description: "Inject BuildKit OTEL build tracing (needs OTEL_EXPORTER_OTLP_* secrets)"
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      OTEL_EXPORTER_OTLP_ENDPOINT:
        required: false
      OTEL_EXPORTER_OTLP_HEADERS:
        required: false

permissions: {}

concurrency:
  # Cancel superseded EDGE builds (no release tag); NEVER cancel a release publish.
  group: container-publish-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release-tag }}${{ inputs.image-name && format('-{0}', inputs.image-name) || '' }}
  cancel-in-progress: ${{ inputs.release-tag == '' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ inputs.image-name && format('{0}/{1}', github.repository_owner, inputs.image-name) || github.repository }}

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Prepare platform pair
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Checkout repository
        if: ${{ inputs.checkout-ref == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-tag || github.ref }}
          persist-credentials: false

      - name: Checkout caller-selected revision
        if: ${{ inputs.checkout-ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false

      - name: Compute VERSION build-arg
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if [ -n "${RELEASE_TAG}" ]; then v="${RELEASE_TAG#v}"; else v="$(git rev-parse --short HEAD)"; fi
          echo "COMPUTED_VERSION=${v}" >> "$GITHUB_ENV"
          # Stable releases override only the version label, not metadata's source/revision.
          # Leave the entire input empty for edge/prerelease builds to retain their defaults.
          if [ -n "${RELEASE_TAG}" ] && [[ "${RELEASE_TAG}" != *-* ]]; then
            echo "OCI_VERSION_LABEL=org.opencontainers.image.version=${v}" >> "$GITHUB_ENV"
          else
            echo "OCI_VERSION_LABEL=" >> "$GITHUB_ENV"
          fi

      # metadata-action's default workflow context labels the triggering workflow's SHA and the
      # licence the repository API reports today. Neither need match the tree checked out above
      # (a release tag or caller-selected ref), so both labels are taken from that checkout.
      - name: Compute source labels
        env:
          IMAGE_LICENSES: ${{ inputs.image-licenses }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse --verify 'HEAD^{commit}')"
          echo "OCI_REVISION_LABEL=org.opencontainers.image.revision=${revision}" >> "$GITHUB_ENV"
          # An SPDX expression only: metadata-action reads newlines as more labels and {{ }} as
          # its own expressions, so anything outside this set fails closed.
          spdx='^[A-Za-z0-9(][A-Za-z0-9.+:() -]*$'
          case "${IMAGE_LICENSES}" in
            ''|dockerfile)
              echo "OCI_LICENSES_LABEL=" >> "$GITHUB_ENV" ;;
            *)
              if [[ ! "${IMAGE_LICENSES}" =~ $spdx ]]; then
                echo "::error::image-licenses must be empty, 'dockerfile' or an SPDX expression" >&2
                exit 1
              fi
              echo "OCI_LICENSES_LABEL=org.opencontainers.image.licenses=${IMAGE_LICENSES}" >> "$GITHUB_ENV" ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Opt-in BuildKit OTEL build tracing. When otel-tracing is off the values are
          # empty (no endpoint => exporter is inert), matching the proven per-repo pattern.
          driver-opts: |
            env.OTEL_EXPORTER_OTLP_ENDPOINT=${{ inputs.otel-tracing && secrets.OTEL_EXPORTER_OTLP_ENDPOINT || '' }}
            env.OTEL_EXPORTER_OTLP_HEADERS=${{ inputs.otel-tracing && secrets.OTEL_EXPORTER_OTLP_HEADERS || '' }}
            env.OTEL_TRACES_EXPORTER=${{ inputs.otel-tracing && 'otlp' || '' }}
            env.OTEL_EXPORTER_OTLP_PROTOCOL=${{ inputs.otel-tracing && 'http/protobuf' || '' }}
            env.OTEL_SERVICE_NAME=${{ inputs.otel-tracing && format('{0}-build', github.event.repository.name) || '' }}
            "env.OTEL_RESOURCE_ATTRIBUTES=ci.pipeline=${{ github.workflow }},ci.run_id=${{ github.run_id }},ci.ref=${{ github.ref_name }}"

      - name: Extract Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            ${{ env.OCI_VERSION_LABEL }}
            ${{ env.OCI_REVISION_LABEL }}
            ${{ env.OCI_LICENSES_LABEL }}

      # A --label always beats the Dockerfile's LABEL, so the API licence is removed rather than
      # blanked when the caller declares its licence in the Dockerfile.
      - name: Drop the repository API licence label
        id: labels
        if: inputs.image-licenses == 'dockerfile'
        env:
          META_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail
          delimiter="labels_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "labels<<${delimiter}"
            grep -v '^org\.opencontainers\.image\.licenses=' <<< "${META_LABELS}" || [ "$?" -eq 1 ]
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub (base-image pulls)
        if: inputs.dockerhub-login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Before the build: the buildx layer cache lives in GHCR, and the publish step pushes there too.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build OCI layout
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ inputs.image-licenses == 'dockerfile' && steps.labels.outputs.labels || steps.meta.outputs.labels }}
          outputs: type=oci,dest=${{ runner.temp }}/image-${{ env.PLATFORM_PAIR }},tar=false
          # Registry cache, not the Actions cache: mode=max layers blew through every repo's 10 GB
          # Actions cache. One moving tag per image and platform; only main/release builds write it,
          # so PRs and merge-queue builds read it without churning it. ghcr-cleanup keeps it.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ env.PLATFORM_PAIR }}
          cache-to: ${{ !contains(fromJSON('["pull_request","pull_request_target","merge_group"]'), github.event_name) && format('type=registry,ref={0}/{1}:buildcache-{2},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', env.REGISTRY, env.IMAGE_NAME, env.PLATFORM_PAIR) || '' }}
          provenance: false
          sbom: false
          build-args: |
            ${{ inputs.build-args }}
            VERSION=${{ env.COMPUTED_VERSION }}

      # Read the labels back from the built image config before anything reaches GHCR, so a
      # revision that is not the checked-out commit stops the publish on each platform.
      - name: Verify source labels
        env:
          LAYOUT: ${{ runner.temp }}/image-${{ env.PLATFORM_PAIR }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_LICENSES: ${{ inputs.image-licenses }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          blob() {
            [[ "$1" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "not a sha256 digest: $1"
            printf '%s/blobs/sha256/%s' "${LAYOUT}" "${1#sha256:}"
          }
          manifest="$(blob "${BUILD_DIGEST}")"
          if jq -e 'has("manifests")' "${manifest}" >/dev/null; then
            manifest="$(blob "$(jq -er '[.manifests[] | select(.mediaType == "application/vnd.oci.image.manifest.v1+json")]
              | if length == 1 then .[0].digest else error("expected one image manifest") end' "${manifest}")")"
          fi
          config="$(blob "$(jq -er '.config.digest' "${manifest}")")"
          label() { jq -r --arg key "$1" '.config.Labels[$key] // ""' "${config}"; }
          revision="$(label org.opencontainers.image.revision)"
          licenses="$(label org.opencontainers.image.licenses)"
          expected="$(git rev-parse --verify 'HEAD^{commit}')"
          [ "${revision}" = "${expected}" ] || fail "image revision '${revision}' is not the checked-out commit ${expected}"
          case "${IMAGE_LICENSES}" in
            '') ;;
            dockerfile) [ -n "${licenses}" ] || fail "image-licenses is 'dockerfile' but the image has no licences label" ;;
            *) [ "${licenses}" = "${IMAGE_LICENSES}" ] || fail "image licences '${licenses}' is not '${IMAGE_LICENSES}'" ;;
          esac
          echo "OCI revision ${revision}; licences ${licenses:-<none>}"

      - name: Install verified Trivy release
        if: inputs.trivy
        env:
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          version=0.70.0
          case "$RUNNER_ARCH" in
            X64) arch=Linux-64bit ;;
            ARM64) arch=Linux-ARM64 ;;
            *) echo "Unsupported Trivy runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          scratch=$(mktemp -d "$RUNNER_TEMP/trivy-download.XXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          asset="trivy_${version}_${arch}.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${version}"
          for name in "$asset" "trivy_${version}_checksums.txt"; do
            curl --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 120 \
              --connect-timeout 20 --max-time 60 --fail --location --silent --show-error \
              --proto '=https' --proto-redir '=https' --output "$scratch/$name" "$base/$name"
          done
          cd "$scratch"
          awk -v asset="$asset" '$2 == asset {print}' "trivy_${version}_checksums.txt" > selected.sha256
          test "$(wc -l < selected.sha256)" -eq 1
          sha256sum --check --strict selected.sha256
          tar -xzf "$asset" trivy
          install -d "$RUNNER_TEMP/trivy-bin"
          install -m 0755 trivy "$RUNNER_TEMP/trivy-bin/trivy"
          "$RUNNER_TEMP/trivy-bin/trivy" --version
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"

      - name: Run Trivy vulnerability scanner
        id: trivy
        if: inputs.trivy
        continue-on-error: true
        env:
          TRIVY_IGNORE_UNFIXED: ${{ inputs.trivy-ignore-unfixed }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          input: ${{ runner.temp }}/image-${{ env.PLATFORM_PAIR }}
          format: sarif
          output: trivy-${{ env.PLATFORM_PAIR }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          limit-severities-for-sarif: true
          # The action's cache writes a new dated Actions-cache entry every day (0.1-0.7 GB each).
          # The DB comes from mirror.gcr.io instead, which has no pull limit worth caching around.
          cache: false
          trivyignores: ${{ inputs.trivy-ignore-file }}
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}

      - name: Upload Trivy SARIF
        if: inputs.trivy && inputs.trivy-upload-sarif && hashFiles(format('trivy-{0}.sarif', env.PLATFORM_PAIR)) != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy-${{ env.PLATFORM_PAIR }}.sarif
          category: trivy-image-${{ inputs.image-name && format('{0}-', inputs.image-name) || '' }}${{ env.PLATFORM_PAIR }}

      - name: Enforce Trivy security gate
        if: inputs.trivy && steps.trivy.outcome == 'failure'
        run: |
          echo "Trivy reported a scanner error or an unaccepted HIGH/CRITICAL finding" >&2
          exit 1

      - name: Install ORAS
        if: github.event_name != 'merge_group' && success()
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
        with:
          version: 1.3.3

      - name: Publish scanned digest
        if: github.event_name != 'merge_group' && success()
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM_PAIR: ${{ env.PLATFORM_PAIR }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        # oras cp reads the manifest back from GHCR straight after pushing it (its
        # non-TTY progress handler lists the manifest's successors), and GHCR can
        # answer 404 for a manifest it has just accepted. The run then fails with
        # "Error response from registry: <digest>: not found" although the digest
        # is published. The copy is content-addressed, so repeating it is
        # idempotent: retry with a short backoff and warn on every retry.
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/image-${PLATFORM_PAIR}@${BUILD_DIGEST}"
          dst="${REGISTRY}/${IMAGE_NAME}@${BUILD_DIGEST}"
          delays=(5 15 30)
          attempt=1
          until oras cp --from-oci-layout "${src}" "${dst}"; do
            if [ "${attempt}" -gt "${#delays[@]}" ]; then
              echo "::error::oras cp of ${BUILD_DIGEST} failed after ${attempt} attempts"
              exit 1
            fi
            delay="${delays[attempt-1]}"
            echo "::warning::oras cp of ${BUILD_DIGEST} failed (attempt ${attempt}); retrying in ${delay}s"
            sleep "${delay}"
            attempt=$((attempt + 1))
          done

      - name: Export digest
        if: github.event_name != 'merge_group'
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${BUILD_DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Keep named images outside the legacy digests-* download namespace.
          name: ${{ inputs.image-name && format('image-{0}-', inputs.image-name) || '' }}digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge + sign + sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build
    if: github.event_name != 'merge_group'
    permissions:
      contents: write        # gh release upload (SBOMs on a release)
      packages: write
      id-token: write         # cosign keyless + provenance attestation
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ inputs.image-name && format('image-{0}-digests-*', inputs.image-name) || 'digests-*' }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install cosign
        if: inputs.sign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Install Syft
        if: inputs.sbom
        uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4

      - name: Extract Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Match the snapshot chart's appVersion (main-<first 12 hex>) so the chart's
          # default image tag names an image this job pushed.
          DOCKER_METADATA_SHORT_SHA_LENGTH: "12"
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,enable=${{ inputs.publish-branch-tags-on-prerelease || !contains(inputs.release-tag, '-') }}
            type=sha,prefix={{branch}}-,enable=${{ (inputs.publish-branch-tags-on-prerelease || !contains(inputs.release-tag, '-')) && '{{is_default_branch}}' || 'false' }}
            type=semver,pattern={{version}},value=${{ inputs.release-tag }},enable=${{ inputs.release-tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release-tag }},enable=${{ inputs.release-tag != '' }}
            type=semver,pattern={{major}},value=${{ inputs.release-tag }},enable=${{ inputs.release-tag != '' }}
            type=raw,value=latest,enable=${{ inputs.release-tag != '' && !contains(inputs.release-tag, '-') }}

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          # shellcheck disable=SC2046  # intentional word-splitting of -t flags and digest refs
          docker buildx imagetools create \
            --metadata-file "$RUNNER_TEMP/published-image.json" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)

      - name: Capture the exact published digest
        id: digest
        run: |
          digest=$(jq -er '."containerimage.descriptor".digest |
            strings | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/published-image.json")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign the published image
        if: inputs.sign
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          # GitHub Cloud exposes the defining workflow in the job context.
          # Parse its documented fields until actionlint models them directly.
          SIGNER_REF: ${{ fromJSON(toJSON(job)).workflow_ref }}
          SIGNER_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ || -z "$SIGNER_REF" || ! "$SIGNER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Missing immutable image digest or signing workflow identity'
            exit 1
          fi
          image_ref="${IMAGE}@${DIGEST}"
          verify=(cosign verify
            --certificate-identity "https://github.com/${SIGNER_REF}"
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY"
            --certificate-github-workflow-ref "$GITHUB_REF"
            --certificate-github-workflow-sha "$GITHUB_SHA"
            "$image_ref")

          verify_image_signature() {
            local verified
            if verified=$("${verify[@]}"); then
              # Cosign also verifies other OCI attestations. Require the image-signature predicate.
              if ! jq -e --arg ref "$image_ref" --arg digest "$DIGEST" '
                type == "array" and any(.[];
                  .critical.type == "https://sigstore.dev/cosign/sign/v1" and
                  .critical.identity["docker-reference"] == $ref and
                  .critical.image["docker-manifest-digest"] == $digest)
              ' <<< "$verified" >/dev/null; then
                echo '::error::No verified image signature matches this index'
                return 1
              fi
            else
              return "$?"
            fi
          }

          if [[ "${SIGNER_REF##*@}" == "$SIGNER_SHA" ]]; then
            if verify_image_signature; then
              echo "Reusing the verified signature for ${image_ref}"
              exit 0
            else
              verification_status=$?
              # Cosign exit 10 means no signatures were found. Other errors fail closed.
              if (( verification_status != 10 )); then
                exit "$verification_status"
              fi
            fi
          fi
          cosign sign --yes "$image_ref"
          verify_image_signature

      - name: Generate build-provenance attestation
        if: inputs.provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM (SPDX + CycloneDX)
        if: inputs.sbom
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          name="${IMAGE##*/}"
          syft "${IMAGE}@${DIGEST}" --output "spdx-json=${name}.spdx.json"
          syft "${IMAGE}@${DIGEST}" --output "cyclonedx-json=${name}.cdx.json"

      - name: Attach SBOMs to the release
        if: inputs.sbom && inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }} # this job has no checkout; gh would else try git and fail
          RELEASE_TAG: ${{ inputs.release-tag }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          name="${IMAGE##*/}"
          gh release upload "${RELEASE_TAG}" "${name}.spdx.json" "${name}.cdx.json" --clobber

  helm:
    name: helm publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: merge
    if: github.event_name != 'merge_group' && inputs.helm-chart-path != ''
    permissions:
      contents: write   # attach chart .tgz to the release
      packages: write
      id-token: write   # cosign sign the chart
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository
        if: ${{ inputs.checkout-ref == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-tag || github.ref }}
          persist-credentials: false

      - name: Checkout caller-selected revision
        if: ${{ inputs.checkout-ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Install cosign
        if: inputs.sign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Log in to GHCR (Helm)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "${GHCR_TOKEN}" | helm registry login ghcr.io -u "${ACTOR}" --password-stdin

      # cosign reads docker's credential store (~/.docker/config.json), NOT helm's,
      # so a docker login is required for it to push the chart signature.
      - name: Log in to GHCR (docker, for cosign)
        if: inputs.sign
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push chart
        id: chart
        env:
          CHART_PATH: ${{ inputs.helm-chart-path }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          CHARTS_REPO: ${{ inputs.charts-repo }}
          IMAGE_DIGEST: ${{ needs.merge.outputs.digest }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          repo="${CHARTS_REPO:-ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts}"
          if [ -n "${RELEASE_TAG}" ]; then
            version="${RELEASE_TAG#v}"
            appversion="${RELEASE_TAG#v}"
          else
            # ArgoCD time-sortable main snapshot: 0.0.0-main.t<unix-ts>.g<shortsha>.
            # BOTH identifiers carry a letter prefix, and both prefixes are load-bearing.
            # A dot-separated semver prerelease identifier made only of digits is a
            # NUMERIC identifier, and numeric identifiers may not have a leading zero --
            # so a commit whose first 12 hex chars happen to be all decimal digits
            # starting with 0 (about 1 in 1,800) produces an invalid version and helm
            # refuses to package it: "version segment starts with 0". The 'g' is the
            # git-describe convention and keeps the sha identifier alphanumeric always.
            # The 't' does the same for the timestamp and sorts it ABOVE legacy
            # 0.0.0-main.<sha> tags; the fixed-width unix ts makes lexical order ==
            # chronological, so a semver-range targetRevision resolves newest. Ordering
            # is unaffected by the 'g': the ts field precedes the sha field and decides
            # every comparison between two distinct publishes.
            short="${SHORT_SHA:0:12}"
            version="0.0.0-main.t$(date +%s).g${short}"
            appversion="main-${short}"
          fi
          helm package "${CHART_PATH}" --version "${version}" --app-version "${appversion}" --destination /tmp/helm
          pkg=$(ls /tmp/helm/*.tgz)
          echo "pkg=${pkg}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # Print helm's output on failure too (a bare command substitution under
          # bash -e exits before the echo), and retry: the package is built once
          # above, so a repeat pushes the same version and digest.
          delays=(5 15 30)
          attempt=1
          until push_out=$(helm push "${pkg}" "oci://${repo}" 2>&1); do
            echo "${push_out}"
            if [ "${attempt}" -gt "${#delays[@]}" ]; then
              echo "::error::helm push of ${version} failed after ${attempt} attempts"
              exit 1
            fi
            delay="${delays[attempt-1]}"
            echo "::warning::helm push of ${version} failed (attempt ${attempt}); retrying in ${delay}s"
            sleep "${delay}"
            attempt=$((attempt + 1))
          done
          echo "${push_out}"
          digest=$(echo "${push_out}" | awk '/Digest:/ {print $2}')
          echo "chart_digest=${digest}" >> "$GITHUB_OUTPUT"
          chart_name=$(helm show chart "${CHART_PATH}" | awk '/^name:/ {print $2}')
          echo "oci_ref=${repo}/${chart_name}" >> "$GITHUB_OUTPUT"

      - name: Sign the chart
        if: inputs.sign && steps.chart.outputs.chart_digest != ''
        env:
          OCI_REF: ${{ steps.chart.outputs.oci_ref }}
          CHART_DIGEST: ${{ steps.chart.outputs.chart_digest }}
        run: cosign sign --yes "${OCI_REF}@${CHART_DIGEST}"

      - name: Attach chart to the release
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }} # explicit repo: no git context to infer from
          RELEASE_TAG: ${{ inputs.release-tag }}
          PKG: ${{ steps.chart.outputs.pkg }}
        run: gh release upload "${RELEASE_TAG}" "${PKG}" --clobber
