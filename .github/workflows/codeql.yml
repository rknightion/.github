name: CodeQL (reusable)

# Reusable CodeQL Advanced workflow for the rknightion fleet. Callers pass a JSON
# array of {language, build-mode} matrix entries. Results upload to the caller
# repo's Security tab (reusable workflows run in the caller's context). Shared
# query/noise policy is embedded here so a caller's pinned workflow SHA owns it.

on:
  workflow_call:
    inputs:
      languages:
        description: 'JSON array of CodeQL matrix include entries, e.g. [{"language":"python","build-mode":"none"}]'
        required: true
        type: string
      timeout-minutes:
        description: >-
          Optional positive whole-minute limit for each analysis job. Leave at zero to use
          120 minutes for Swift and 60 minutes for other languages.
        type: number
        default: 0
      ref:
        description: "Repository ref to analyze; empty uses the triggering SHA"
        required: false
        type: string
        default: ""
      category-suffix:
        description: "Suffix appended to each CodeQL analysis category"
        required: false
        type: string
        default: ""
      fail-on-security-severity:
        description: "Fail on CodeQL security severity: none, high, or critical"
        required: false
        type: string
        default: "none"

permissions: {}

# Cancel a superseded scan on the same ref (rapid pushes / PR updates) to free runners.
# Unique group prefix per reusable so a caller invoking several reusables doesn't put
# them in one group where they'd cancel each other.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes || (matrix.language == 'swift' && 120) || 60 }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.languages) }}
    steps:
      # Scope: on a push, read the compared file list through the API (no checkout) and skip analysis
      # when no file for this matrix language changed (the `actions` language: only .github/** and
      # action.yml files). The job still runs and reports. schedule, workflow_dispatch and pull_request
      # runs are always full, so the weekly scan stays a complete re-analysis. Fails closed: no gh, an
      # unreadable or truncated comparison (the API lists at most 300 files), a new branch or tag, a
      # forced push whose old commit is gone, an explicit ref input, or a language this map does not
      # know all run the full scan.
      - name: Scope (skip a push when no file for the language changed)
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          LANGUAGE: ${{ matrix.language }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -uo pipefail
          full() { echo "Running the full analysis: $1"; echo "analyze=true" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$EVENT" = push ] || full "not a push run"
          [ -z "$INPUT_REF" ] || full "an explicit ref input analyses a revision other than the push"
          command -v gh >/dev/null 2>&1 || full "gh is not available"
          [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]] || full "no previous commit to compare"
          [[ "$AFTER" =~ ^[0-9a-f]{40}$ ]] || full "no pushed commit"
          case "$LANGUAGE" in
            actions) relevant='^\.github/|(^|/)action\.ya?ml$' ;;
            python) relevant='\.(py|pyi|pyw)$|(^|/)(requirements[^/]*\.txt|pyproject\.toml|setup\.(py|cfg)|Pipfile|poetry\.lock|uv\.lock)$' ;;
            javascript|typescript|javascript-typescript) relevant='\.(js|jsx|mjs|cjs|es6?|ts|tsx|mts|cts|vue|html?|json)$|(^|/)(package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml)$' ;;
            go) relevant='\.go$|(^|/)go\.(mod|sum|work)$' ;;
            ruby) relevant='\.(rb|erb|gemspec|rake)$|(^|/)(Gemfile(\.lock)?|Rakefile)$' ;;
            rust) relevant='\.rs$|(^|/)Cargo\.(toml|lock)$' ;;
            java|kotlin|java-kotlin) relevant='\.(java|kt|kts|gradle|xml|properties|toml)$|(^|/)(gradlew|gradle\.lockfile)$' ;;
            csharp) relevant='\.(cs|csx|cshtml|razor|csproj|sln|slnx|props|targets|config|json)$' ;;
            c-cpp) relevant='\.(c|cc|cpp|cxx|c\+\+|h|hh|hpp|hxx|inl|ipp|cmake|mk|in|am|ac)$|(^|/)(CMakeLists\.txt|Makefile|configure|meson\.build|BUILD|WORKSPACE|MODULE\.bazel)$' ;;
            swift) relevant='\.(swift|plist|pbxproj|xcconfig|resolved)$|(^|/)Package\.swift$' ;;
            *) full "no path map for language $LANGUAGE" ;;
          esac
          # The compare API returns `files` only on the first page and at most 300 files for the whole
          # comparison, so --paginate adds none. A count of 300 or more may be truncated: run in full.
          # https://docs.github.com/en/rest/commits/commits#compare-two-commits
          listing=$(gh api --paginate "repos/$GH_REPO/compare/$BEFORE...$AFTER?per_page=100" \
            --jq '.files[]? | "\(.filename)\t\(.previous_filename // "")"') || full "the comparison could not be read"
          total=$(printf '%s' "$listing" | grep -c '' || true)
          [ "$total" -lt 300 ] || full "the comparison lists 300 or more files, the API cap, so it may be truncated"
          [ "$total" -gt 0 ] || full "the comparison lists no files"
          if printf '%s\n' "$listing" | tr '\t' '\n' | grep -Eq "$relevant"; then
            full "a $LANGUAGE file changed"
          fi
          echo "No $LANGUAGE file changed in this push: skipping the analysis."
          echo "analyze=false" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: ${{ steps.scope.outputs.analyze == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Resolve analyzed revision
        id: revision
        if: ${{ steps.scope.outputs.analyze == 'true' }}
        env:
          INPUT_REF: ${{ inputs.ref }}
          TRIGGER_REF: ${{ github.ref }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          sha=$(git rev-parse HEAD)
          if [[ -z "${INPUT_REF}" ]]; then
            ref="${TRIGGER_REF}"
          elif [[ "${INPUT_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            if [[ "${INPUT_REF}" != "${TRIGGER_SHA}" || "${sha}" != "${TRIGGER_SHA}" ]]; then
              echo "An explicit SHA must match the triggering revision" >&2
              exit 1
            fi
            ref="${TRIGGER_REF}"
          elif [[ "${INPUT_REF}" == refs/* ]]; then
            ref="${INPUT_REF}"
          elif git show-ref --verify --quiet "refs/tags/${INPUT_REF}"; then
            ref="refs/tags/${INPUT_REF}"
          elif git show-ref --verify --quiet "refs/heads/${INPUT_REF}"; then
            ref="refs/heads/${INPUT_REF}"
          else
            echo "Cannot resolve analyzed ref: ${INPUT_REF}" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Initialize CodeQL
        if: ${{ steps.scope.outputs.analyze == 'true' }}
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            name: "rknightion standard CodeQL config"
            queries:
              - uses: security-extended
            query-filters:
              - exclude:
                  tags contain: experimental
            paths-ignore:
              - '**/node_modules'
              - '**/vendor'
              - '**/third_party'
              - '**/dist'
              - '**/build'
              - '**/*.min.js'
              - '**/*.test.*'
              - '**/*.spec.*'
              - 'test'
              - 'tests'
              - 'docs'
              - 'examples'

      - name: Autobuild
        if: ${{ steps.scope.outputs.analyze == 'true' && matrix.build-mode == 'autobuild' }}
        uses: github/codeql-action/autobuild@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5

      - name: Perform CodeQL Analysis
        id: analyze
        if: ${{ steps.scope.outputs.analyze == 'true' }}
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:${{ matrix.language }}${{ inputs.category-suffix }}"
          output: ${{ runner.temp }}/codeql-results
          upload: always
          ref: ${{ steps.revision.outputs.ref }}
          sha: ${{ steps.revision.outputs.sha }}

      - name: Enforce CodeQL security-severity threshold
        if: ${{ steps.scope.outputs.analyze == 'true' && inputs.fail-on-security-severity != 'none' }}
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
          THRESHOLD: ${{ inputs.fail-on-security-severity }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          thresholds = {"high": 7.0, "critical": 9.0}
          threshold_name = os.environ["THRESHOLD"]
          if threshold_name not in thresholds:
              raise SystemExit(f"invalid CodeQL security threshold: {threshold_name}")

          findings = []
          for path in sorted(Path(os.environ["SARIF_DIR"]).glob("*.sarif")):
              payload = json.loads(path.read_text(encoding="utf-8"))
              for run in payload.get("runs", []):
                  rules = run.get("tool", {}).get("driver", {}).get("rules", [])
                  by_id = {rule.get("id"): rule for rule in rules}
                  for result in run.get("results", []):
                      rule = by_id.get(result.get("ruleId"), {})
                      index = result.get("ruleIndex")
                      if isinstance(index, int) and 0 <= index < len(rules):
                          rule = rules[index]
                      score = rule.get("properties", {}).get("security-severity")
                      try:
                          numeric_score = float(score)
                      except (TypeError, ValueError):
                          continue
                      if numeric_score >= thresholds[threshold_name]:
                          findings.append((result.get("ruleId", "unknown"), numeric_score))

          if findings:
              for rule_id, score in findings:
                  print(f"CodeQL finding at or above {threshold_name}: {rule_id} ({score})")
              raise SystemExit(1)
          PY
