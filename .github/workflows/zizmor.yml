name: zizmor (reusable)

# Reusable GitHub Actions security audit (zizmor). Findings upload to the caller
# repo's Security tab as SARIF.

on:
  workflow_call: {}

permissions: {}

# Cancel a superseded run on the same ref (rapid pushes / PR updates) to free runners.
# Unique group prefix per reusable so a caller invoking several reusables doesn't put
# them in one group where they'd cancel each other.
concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Run zizmor
    # SARIF upload needs security-events: write, which GitHub does not grant to
    # pull_request runs from forks (the upload would 403 and fail the job). Run
    # on push + same-repo PRs only; fork PRs are re-scanned after merge on push.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # EVERY uses: must be hash-pinned — first-party rknightion reusables included.
      # As of v1.0.0 the fleet pins these reusables to a release SHA (with a # vX.Y.Z
      # comment) and Renovate maintains the bump, so floating @main is no longer used;
      # requiring hash-pin here makes that self-enforcing (a reintroduced @main fails
      # CI). Written as an auto-discovered .github/zizmor.yml (ephemeral, not committed);
      # skipped if the repo already ships its own zizmor config.
      - name: Write zizmor policy
        run: |
          if [ ! -e .github/zizmor.yml ]; then
            mkdir -p .github
            {
              echo 'rules:'
              echo '  unpinned-uses:'
              echo '    config:'
              echo '      policies:'
              echo '        "*": hash-pin'
            } > .github/zizmor.yml
          fi

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
