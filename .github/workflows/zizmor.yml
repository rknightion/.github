name: zizmor (reusable)

# Reusable GitHub Actions security audit (zizmor). Findings upload to the caller
# repo's Security tab as SARIF. With `enforce: true`, a pull_request run prints findings as
# annotations instead and zizmor's own non-zero exit fails the job, so a caller that lists this job
# in its ci-success needs blocks the merge. Diagnostic runs can omit the upload without changing
# which findings fail a run.

on:
  workflow_call:
    inputs:
      enforce:
        description: Fail pull_request runs on findings instead of only uploading SARIF.
        type: boolean
        default: false
      upload-sarif:
        description: Upload diagnostic SARIF when the caller supports GitHub Code Security.
        type: boolean
        default: true
      runs-on:
        description: "Runner label. Any runner label."
        required: false
        type: string
        default: "ubuntu-latest"
      harden:
        description: >-
          Deprecated, no effect. harden-runner was removed from this workflow; the input stays so
          callers that still pass it keep starting.
        required: false
        type: boolean
        default: true

permissions: {}

# Cancel a superseded run on the same ref (rapid pushes / PR updates) to free runners.
# Unique group prefix per reusable so a caller invoking several reusables doesn't put
# them in one group where they'd cancel each other.
concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      actions: read
    env:
      ZIZMOR_VERSION: '1.31.1'
      ZIZMOR_DIAGNOSTIC_MODE: ${{ !(inputs.enforce && github.event_name == 'pull_request') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      # Scope: on a pull request, read the PR file list through the API (no checkout) and skip the
      # heavy steps when no workflow, action or zizmor-config file changed. The job still runs and reports, so a
      # required check stays satisfied. Fails closed: no gh, an API error, or a list that is
      # truncated (the API caps it at 3000 files) or does not match changed_files all run the full
      # check. push, schedule and dispatch runs are always complete.
      - name: Scope (skip when no workflow, action or zizmor-config file changed)
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          RELEVANT: '^\.github/(workflows|actions)/|^\.github/(zizmor|dependabot)\.ya?ml$|(^|/)action\.ya?ml$'
          SARIF_UPLOAD: ${{ inputs.upload-sarif }}
          DIAGNOSTIC: ${{ env.ZIZMOR_DIAGNOSTIC_MODE }}
        run: |
          set -uo pipefail
          full() { echo "Running the full check: $1"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "${SARIF_UPLOAD:-}" = true ] && [ "${DIAGNOSTIC:-}" = true ]; then full "this run uploads SARIF"; fi
          [ "$EVENT" = pull_request ] || full "not a pull_request run"
          command -v gh >/dev/null 2>&1 || full "gh is not available"
          [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$CHANGED_FILES" =~ ^[0-9]+$ ]] || full "pull request metadata is missing"
          [ "$CHANGED_FILES" -lt 3000 ] || full "the file list is capped at 3000 files"
          listing=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | "\(.filename)\t\(.previous_filename // "")"') || full "the file list could not be read"
          count=$(printf '%s' "$listing" | grep -c '' || true)
          [ "$count" -eq "$CHANGED_FILES" ] || full "listed $count files, expected $CHANGED_FILES"
          # Not a pipe into grep -q: it exits on the first match, and under pipefail the SIGPIPE
          # that printf or tr then gets would read as "no relevant file" and skip the check.
          paths=$(printf '%s\n' "$listing" | tr '\t' '\n')
          if grep -Eq "$RELEVANT" <<<"$paths"; then
            full "a relevant file changed"
          fi
          echo "No workflow, action or zizmor-config file changed in this pull request: skipping the check."
          echo "run=false" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: ${{ steps.scope.outputs.run == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # EVERY uses: must be hash-pinned — first-party rknightion reusables included.
      # As of v1.0.0 the fleet pins these reusables to a release SHA (with a # vX.Y.Z
      # comment) and Renovate maintains the bump, so floating @main is no longer used;
      # requiring hash-pin here makes that self-enforcing (a reintroduced @main fails
      # CI). Written as an auto-discovered .github/zizmor.yml (ephemeral, not committed);
      # skipped if the repo already ships its own zizmor config.
      #
      # self-repository is off: it asks for the `$/` same-repo `uses:` form, but
      # actionlint (pinned in actionlint.yml) rejects `$/` as an invalid reusable
      # workflow call, so following it trades a zizmor finding for an actionlint
      # failure. `./` for a job-level reusable call already resolves at the
      # caller's commit. Re-enable once the pinned actionlint parses `$/`.
      - name: Write zizmor policy
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: |
          if [ ! -e .github/zizmor.yml ]; then
            mkdir -p .github
            {
              echo 'rules:'
              echo '  unpinned-uses:'
              echo '    config:'
              echo '      policies:'
              echo '        "*": hash-pin'
              echo '  self-repository:'
              echo '    disable: true'
            } > .github/zizmor.yml
          fi

      - name: Run zizmor
        if: ${{ steps.scope.outputs.run == 'true' && (inputs.upload-sarif || env.ZIZMOR_DIAGNOSTIC_MODE != 'true') }}
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          version: ${{ env.ZIZMOR_VERSION }}
          # Diagnostic SARIF reports findings. Enforced and fork PRs use failing annotations.
          advanced-security: ${{ env.ZIZMOR_DIAGNOSTIC_MODE }}
          annotations: ${{ github.event_name == 'pull_request' && (inputs.enforce || github.event.pull_request.head.repo.full_name != github.repository) }}

      - name: Run zizmor without uploading SARIF
        if: ${{ steps.scope.outputs.run == 'true' && !inputs.upload-sarif && env.ZIZMOR_DIAGNOSTIC_MODE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          scratch=$(mktemp -d "$RUNNER_TEMP/zizmor-diagnostic.XXXXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT

          # Use the same hash-locked wheels and diagnostic format as the composite action.
          # Update this lock digest with the action pin and version above.
          lock="$scratch/requirements.txt"
          curl --fail --silent --show-error --proto '=https' --output "$lock" \
            "https://raw.githubusercontent.com/zizmorcore/zizmor-action/53290badfa369cb0bf7ad16342cb62c2fa47ac7b/support/locks/zizmor-$ZIZMOR_VERSION.txt"
          printf '%s  %s\n' 'beaab5d8a31b9f9005986244d8bf944ff2b12c330569ed169f947bae83f35bd1' "$lock" | sha256sum --check
          python3 -m venv "$scratch/venv"
          "$scratch/venv/bin/python" -m pip download --quiet --no-input --disable-pip-version-check \
            --only-binary=:all: --python-version=3.11 --no-deps --require-hashes \
            --dest "$scratch" --requirement "$lock"
          wheels=("$scratch"/*.whl)
          [[ ${#wheels[@]} -eq 1 && -f ${wheels[0]} ]]
          python3 -m zipfile --extract "${wheels[0]}" "$scratch/unpacked"
          zizmor="$scratch/unpacked/zizmor-$ZIZMOR_VERSION.data/scripts/zizmor"
          chmod +x "$zizmor"
          "$zizmor" --persona=regular --format=sarif --collect=default --color=always -- .
