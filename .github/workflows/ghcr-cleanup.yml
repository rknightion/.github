# Shared reusable: prune GHCR.
#
# WHY THIS IS NOT actions/delete-package-versions: that action's
# `delete-only-untagged-versions` would delete the per-architecture child
# manifests that a merged multi-arch index references, silently breaking every
# tagged image, and it does not understand cosign's `sha256-<digest>` signature
# tags. dataaxiom/ghcr-cleanup-action understands multi-arch children,
# referrers/attestations and orphaned signature tags, and `validate: true`
# re-resolves every surviving multi-arch image afterwards.
#
# DEFAULTS TO DRY RUN. A caller must pass dry-run: false to actually delete.
name: ghcr-cleanup (reusable)

on:
  workflow_call:
    inputs:
      packages:
        description: "Comma-separated GHCR packages to prune, e.g. 'graph2otel,charts/graph2otel'."
        required: true
        type: string
      dry-run:
        description: "Report what would be deleted without deleting it."
        required: false
        type: boolean
        default: true
      keep-n-rc:
        description: "How many of the newest release-candidate versions to keep."
        required: false
        type: number
        default: 10
      edge-older-than:
        description: "Delete main-<sha> edge images older than this."
        required: false
        type: string
        default: "7 days"
      edge-tags:
        description: >-
          Regex of edge tags produced by ordinary pushes to main. The default
          matches the fleet convention `main-<sha>`. A repo that also publishes
          a suffixed variant of the same commit (portina pushes
          `main-<sha>-render` alongside `main-<sha>`) must widen this, or that
          variant matches no rule and is never pruned.
        required: false
        type: string
        default: '^main-[0-9a-f]+$'
      dev-chart-tags:
        description: >-
          Regex of throwaway dev versions published on every push to main.
          Defaults to the Helm OCI convention `0.0.0-main.t<epoch>.g<sha>`,
          which matches NO other rule here: it is not `main-<sha>`, not
          `buildcache-*`, not `-rc.N`, and the protected-tags regex does not
          cover it because it is not digits-and-dots throughout. Left unpruned
          these dominate a chart package -- charts/tailscale2otel was 568 of
          2,129 versions, and each drags a cosign signature and an attestation
          with it. Set to a regex matching nothing to disable.
        required: false
        type: string
        default: '^0\.0\.0-main\..*$'
      dev-chart-older-than:
        description: >-
          Delete dev chart versions older than this. Deliberately longer than
          edge-older-than: a Helm release may be pinned to one of these, so the
          window is wide enough to notice before the artifact goes.
        required: false
        type: string
        default: "30 days"
      protected-tags:
        description: >-
          Regex of tags that must NEVER be pruned, whatever other rule matches.
          A GHCR "version" is a DIGEST, and every tag on that digest belongs to
          the one version -- so the release build and the edge build of the same
          commit share a version carrying BOTH `main-<sha>` AND `2.0.0`/`latest`.
          Deleting it by the edge rule would delete the release. Verified on
          graph2otel: version 1116391216 carried main-0d14f3f,2,2.0,2.0.0,latest.
        required: false
        type: string
        # Deliberately flat: the action rejects nested quantifiers such as
        # (\.[0-9]+)* as ReDoS-prone. [0-9.]+ covers 2, 2.0, 2.0.0 and v2.0.0
        # without nesting, and cannot match main-<sha>, buildcache-* or an
        # -rc.N tag, because none of those are digits-and-dots throughout.
        default: '^(latest|main|v?[0-9.]+)$'
      runs-on:
        description: >-
          Runner label for the prune job. Defaults to a GitHub-hosted runner,
          which is free for the public rknightion repos. m7kni's repos are
          PRIVATE, so a hosted runner there bills Actions minutes -- those
          callers pass their self-hosted `arc-arm64` label instead. The action
          is pure JS, so the runner's architecture does not matter.
        required: false
        type: string
        default: 'ubuntu-24.04'
      harden:
        description: >-
          Run step-security/harden-runner. MUST be false on a self-hosted
          runner: no m7kni arc-arm64 workflow runs it, and harden-runner's
          egress monitoring is built for GitHub-hosted Ubuntu images.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prune:
    name: prune ${{ inputs.packages }}
    runs-on: ${{ inputs.runs-on }}
    # 30 minutes is not enough for a FIRST prune. The action deletes one version
    # per API call, and an un-pruned repo accumulates ~6 versions per push to
    # main: graph2otel had 3,659 versions and its first real run was killed by a
    # 30-minute timeout less than halfway through. Steady-state weekly runs take
    # a couple of minutes; the ceiling exists for the initial backlog.
    timeout-minutes: 300
    # Two concurrent prunes on one package race each other's version listings and
    # one deletes a digest the other has already resolved. Serialize, never cancel.
    concurrency:
      group: ghcr-cleanup-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write # delete package versions
    steps:
      - name: Harden the runner (audit egress)
        if: ${{ inputs.harden }}
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # Stale buildkit layer caches. Regenerated on the next build; referenced by
      # nothing. Safe to prune hard, and this is the bulk of the untagged volume.
      - name: Prune stale buildcache
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ github.token }}
          packages: ${{ inputs.packages }}
          use-regex: true
          delete-tags: '^buildcache-.*$'
          exclude-tags: ${{ inputs.protected-tags }}
          older-than: 7 days
          delete-orphaned-images: true
          validate: true
          dry-run: ${{ inputs.dry-run }}

      # Edge images from ordinary pushes to main. `main` itself is never deleted
      # (it is the moving edge pointer); only the pinned main-<sha> history is.
      - name: Prune old edge images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ github.token }}
          packages: ${{ inputs.packages }}
          use-regex: true
          delete-tags: ${{ inputs.edge-tags }}
          exclude-tags: ${{ inputs.protected-tags }}
          older-than: ${{ inputs.edge-older-than }}
          delete-orphaned-images: true
          validate: true
          dry-run: ${{ inputs.dry-run }}

      # Dev chart versions from pushes to main. The chart equivalent of the edge
      # images above, and the single biggest retention leak before this step
      # existed: nothing else here matches `0.0.0-main.t<epoch>.g<sha>`.
      - name: Prune old dev chart versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ github.token }}
          packages: ${{ inputs.packages }}
          use-regex: true
          delete-tags: ${{ inputs.dev-chart-tags }}
          exclude-tags: ${{ inputs.protected-tags }}
          older-than: ${{ inputs.dev-chart-older-than }}
          delete-orphaned-images: true
          validate: true
          dry-run: ${{ inputs.dry-run }}

      # Release candidates: keep the newest N, drop the rest. Stable tags are
      # excluded by the glob -- `*-rc.*` cannot match vX.Y.Z, X.Y, X or latest.
      - name: Prune old release candidates
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ github.token }}
          packages: ${{ inputs.packages }}
          use-regex: true
          delete-tags: '^.*-rc\.[0-9]+$'
          exclude-tags: ${{ inputs.protected-tags }}
          keep-n-tagged: ${{ inputs.keep-n-rc }}
          delete-orphaned-images: true
          validate: true
          dry-run: ${{ inputs.dry-run }}

      # Anything left untagged and unreferenced -- orphaned attestation layers and
      # cosign sha256- signatures whose subject digest is already gone. Runs last
      # so the earlier steps' orphans are swept in the same pass.
      - name: Prune orphans
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ github.token }}
          packages: ${{ inputs.packages }}
          use-regex: true
          exclude-tags: ${{ inputs.protected-tags }}
          delete-orphaned-images: true
          keep-n-untagged: 0
          validate: true
          dry-run: ${{ inputs.dry-run }}
