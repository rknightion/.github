# Release automation for the shared-workflows repo itself. On every push to main,
# release-please maintains a "release PR" that, from the Conventional Commits since the
# last release, computes the next semver, updates CHANGELOG.md + the manifest, and on
# merge tags vX.Y.Z + creates the GitHub Release. Consumers pin these reusables to the
# release SHA (# vX.Y.Z) and Renovate bumps them when a new release lands.
#
# Opened under a PAT (not GITHUB_TOKEN) so the bot-authored release PR runs CI (and can
# be automerged) instead of being parked at "action_required".
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Serialize release-please on rapid main pushes; never cancel one mid-flight.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release commit, tag, and GitHub Release
      pull-requests: write # open/update the release PR
      id-token: write # exchanged for a tailnet identity and an OpenBao token
    steps:
      # Mints a short-lived GitHub App installation token scoped to THIS repo,
      # replacing RELEASE_PLEASE_TOKEN -- a PAT scoped across every rknightion repo.
      # Nothing durable is stored here to leak. The release PR's author becomes the
      # App rather than rknightion; CI still runs unattended on it, because the
      # action_required gate applies to github-actions[bot], not to bot identities
      # generally -- Renovate, a GitHub App, already runs fine.
      #
      # Releases now depend on camden being up, unsealed and on the tailnet; a
      # failure here is infrastructure, not the commit.
      - name: Mint a scoped release token
        id: bao
        uses: rknightion/.github/.github/actions/broker-token@b9ab5f80961f2c29c47a8d7d5dff112b6551169c
        with:
          permission-set: release-please-dot-github
          tailscale-client-id: ${{ secrets.TS_WIF_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_WIF_AUDIENCE }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.bao.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json