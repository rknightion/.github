name: CodeQL (self)

# This repo's own CodeQL scan. codeql.yml here IS the reusable, so this thin caller runs it by ./
# path against the pushed ref. It runs on push to main and weekly, never on pull_request: ci.yml
# keeps the fast PR checks (actionlint, zizmor, just check) and CodeQL does not gate a merge.
# Both the `actions` and `python` (fleet/, scripts/) code are analysed.
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 3 * * 4'

permissions: {}

jobs:
  codeql:
    permissions:
      security-events: write # uploads CodeQL results
      packages: read # permits analysis of package metadata
      actions: read # reads workflow metadata for Actions analysis
      contents: read # checks out and analyzes repository source
    uses: ./.github/workflows/codeql.yml
    with:
      languages: '[{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
      timeout-minutes: 30
