name: Cursor Cloud base image

on:
  pull_request:
    branches: [main]
    paths:
      - cursor-base/**
      - .github/workflows/cursor-base.yml
  push:
    branches: [main]
    paths:
      - cursor-base/**
      - .github/workflows/cursor-base.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: cursor-base-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and smoke (${{ matrix.arch }})
    if: github.repository == 'rknightion/.github' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    env:
      ARCH: ${{ matrix.arch }}
      TAG: cursor-cloud-base:test-${{ matrix.arch }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a native runner
        env:
          MACHINE: ${{ matrix.machine }}
        run: test "$(uname -s)/$(uname -m)" = "Linux/$MACHINE"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the public context
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          docker build --builder "$BUILDER" --platform "linux/$ARCH" -t "$TAG" \
            --label org.opencontainers.image.source=https://github.com/rknightion/.github \
            --provenance=false --sbom=false --output type=docker \
            --output "type=oci,dest=$RUNNER_TEMP/cursor-base-oci,tar=false,oci-mediatypes=true" cursor-base

      - name: Smoke test the native image
        run: docker run --rm --pull never --platform "linux/$ARCH" "$TAG" /usr/local/bin/cursor-base-smoke "$ARCH"

      - name: Exercise nested Docker on the disposable runner
        if: github.event_name != 'pull_request'
        run: docker run --rm --pull never --privileged --network none --platform "linux/$ARCH" "$TAG" /usr/local/bin/cursor-base-smoke "$ARCH" --docker

      - name: Verify the publishable image is the tested image
        run: |
          layout="$RUNNER_TEMP/cursor-base-oci"
          digest=$(jq -er '.manifests | select(length == 1) | .[0].digest | select(test("^sha256:[0-9a-f]{64}$"))' "$layout/index.json")
          manifest="$layout/blobs/sha256/${digest#sha256:}"
          config=$(jq -er '.config.digest | select(test("^sha256:[0-9a-f]{64}$"))' "$manifest")
          test "$(docker image inspect --format '{{.Id}}' "$TAG")" = "$config"
          jq -e --arg arch "$ARCH" '.os == "linux" and .architecture == $arch' \
            "$layout/blobs/sha256/${config#sha256:}" >/dev/null

          local_bytes=$(docker image inspect --format '{{.Size}}' "$TAG")
          jq -n --arg digest "$digest" --argjson localBytes "$local_bytes" \
            '{digest: $digest, localBytes: $localBytes}' > "$layout/smoke-receipt.json"

      - name: Reject secrets in the exported image
        run: |
          version=0.70.0
          case "$ARCH" in
            amd64) asset_arch=Linux-64bit ;;
            arm64) asset_arch=Linux-ARM64 ;;
            *) exit 1 ;;
          esac
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          cd "$scratch" || exit 1
          asset="trivy_${version}_${asset_arch}.tar.gz"
          checksums="trivy_${version}_checksums.txt"
          base="https://github.com/aquasecurity/trivy/releases/download/v$version"
          {
            for file in "$asset" "$checksums"; do
              curl --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 120 \
                --connect-timeout 20 --max-time 60 --fail --location --silent --show-error \
                --proto '=https' --proto-redir '=https' --output "$file" "$base/$file"
            done
            awk -v asset="$asset" '$2 == asset {print}' "$checksums" > selected.sha256
            test "$(wc -l < selected.sha256)" -eq 1
            sha256sum --check --strict selected.sha256
            tar -xzf "$asset" trivy
          } > install.log 2>&1

          if ! ./trivy --cache-dir "$scratch/cache" --quiet image --timeout 10m \
            --scanners secret --image-config-scanners secret --offline-scan \
            --skip-db-update --skip-java-db-update --skip-version-check --disable-telemetry \
            --format json --output report.json --input "$RUNNER_TEMP/cursor-base-oci" > scan.log 2>&1; then
            echo '::error::Image secret scan failed to complete.'
            exit 1
          fi
          findings=$(jq -er 'select(.SchemaVersion == 2 and .ArtifactType == "container_image")
            | [.Results[]? | .Secrets[]?] | length' report.json 2>/dev/null)
          if (( findings > 0 )); then
            echo "::error::Image secret scan found $findings result(s)."
            exit 1
          fi
          echo 'Image secret scan passed with 0 findings.'

      - name: Upload the tested image from main
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cursor-base-oci-${{ matrix.arch }}
          path: ${{ runner.temp }}/cursor-base-oci/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

  publish:
    name: Publish the stable multi-platform image
    if: github.repository == 'rknightion/.github' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/rknightion/cursor-cloud-base
    steps:
      - name: Download both images from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/cursor-base-images
          pattern: cursor-base-oci-*

      - name: Set up ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.3

      - name: Prepare the multi-platform index
        run: |
          meta="$RUNNER_TEMP/cursor-base-publish"
          mkdir -p "$meta"
          for arch in amd64 arm64; do
            layout="$RUNNER_TEMP/cursor-base-images/cursor-base-oci-$arch"
            digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' "$layout/smoke-receipt.json")
            manifest="$layout/blobs/sha256/${digest#sha256:}"
            printf '%s  %s\n' "${digest#sha256:}" "$manifest" | sha256sum --check --strict --status
            media_type=$(jq -er '.mediaType | select(. == "application/vnd.oci.image.manifest.v1+json")' "$manifest")
            manifest_bytes=$(wc -c < "$manifest")
            local_bytes=$(jq -er '.localBytes | select(type == "number" and . > 0)' "$layout/smoke-receipt.json")
            blob_bytes=$(jq -er '[.config.size, .layers[].size] | add | select(. > 0)' "$manifest")
            jq -er '[.config, .layers[]] | map(.digest)
              | if all(.[]; test("^sha256:[0-9a-f]{64}$")) then .[] else error("invalid blob digest") end' \
              "$manifest" > "$meta/$arch-blobs"
            while IFS= read -r blob; do
              printf '%s  %s\n' "${blob#sha256:}" "$layout/blobs/sha256/${blob#sha256:}"
            done < "$meta/$arch-blobs" | sha256sum --check --strict --status
            jq -n --arg arch "$arch" --arg digest "$digest" --arg mediaType "$media_type" --argjson size "$manifest_bytes" \
              '{mediaType: $mediaType, digest: $digest, size: $size, platform: {os: "linux", architecture: $arch}}' \
              > "$meta/$arch.json"
            printf '| linux/%s | %s | %s | %s |\n' "$arch" "$digest" "$blob_bytes" "$local_bytes" >> "$meta/receipt"
          done
          jq -s '{schemaVersion: 2, mediaType: "application/vnd.oci.image.index.v1+json", manifests: .}' \
            "$meta/amd64.json" "$meta/arm64.json" > "$meta/index.json"

      - name: Publish tested digests and verify the stable tag
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          registry_password=${GHCR_TOKEN:?Missing publishing job token}
          unset GHCR_TOKEN
          meta="$RUNNER_TEMP/cursor-base-publish"
          index="$meta/index.json"
          declare -A uploaded=()
          for arch in amd64 arm64; do
            layout="$RUNNER_TEMP/cursor-base-images/cursor-base-oci-$arch"
            while IFS= read -r blob; do
              if [[ -z "${uploaded[$blob]+present}" ]]; then
                printf '%s\n' "$registry_password" | oras blob push --username "$GHCR_ACTOR" --password-stdin \
                  "$IMAGE@$blob" "$layout/blobs/sha256/${blob#sha256:}"
                uploaded[$blob]=1
              fi
            done < "$meta/$arch-blobs"
            digest=$(jq -er '.digest' "$meta/$arch.json")
            media_type=$(jq -er '.mediaType' "$meta/$arch.json")
            printf '%s\n' "$registry_password" | oras manifest push --username "$GHCR_ACTOR" --password-stdin \
              --media-type "$media_type" "$IMAGE@$digest" "$layout/blobs/sha256/${digest#sha256:}"
          done

          index_digest="sha256:$(sha256sum "$index" | cut -d' ' -f1)"
          printf '%s\n' "$registry_password" | oras manifest push --username "$GHCR_ACTOR" --password-stdin \
            --media-type application/vnd.oci.image.index.v1+json "$IMAGE:1" "$index"
          printf '%s\n' "$registry_password" | oras manifest fetch --username "$GHCR_ACTOR" --password-stdin \
            --descriptor "$IMAGE:1" | jq -e --arg digest "$index_digest" '.digest == $digest' >/dev/null

          {
            printf '### Published Cursor Cloud base image\n\n'
            printf '%s:1@%s\n\n' "$IMAGE" "$index_digest"
            printf 'Source revision %s\n\n' "$GITHUB_SHA"
            printf '| Platform | Manifest digest | Compressed layers and config (bytes) | Local image size (bytes) |\n'
            printf '| --- | --- | ---: | ---: |\n'
            cat "$meta/receipt"
          } >> "$GITHUB_STEP_SUMMARY"
