# Shared reusable: build + publish release BINARIES via GoReleaser.
#
# Companion to container-publish.yml (which owns the image + Helm chart). This builds
# the cross-compiled binaries, checksums, archive SBOMs and (optionally) cosign blob
# signatures, and uploads them to the GitHub Release that release-please already created
# for the tag. It is OPT-IN: only repos that ship a .goreleaser.{yml,yaml} call it, from
# their release-please `publish` path, gated on release_created.
#
# What gets built/signed/SBOM'd is driven by the repo's own .goreleaser config — this
# workflow only provides the toolchain (Go, optionally cosign) and runs `goreleaser`.
# `images` are expected to be handled by container-publish.yml, so binary-only repos pass
# goreleaser-args: "release --clean --skip=docker" (or simply omit dockers: from config).
name: binaries (reusable)

on:
  workflow_call:
    inputs:
      release-tag:
        description: "The vX.Y.Z tag to build and attach assets to (release-please tag_name)."
        required: true
        type: string
      go-version:
        description: "Explicit Go version for setup-go. Takes precedence over go-version-file."
        required: false
        type: string
        default: ""
      go-version-file:
        description: "Path to the file setup-go reads the Go version from (ignored if go-version set)."
        required: false
        type: string
        default: "go.mod"
      goreleaser-version:
        description: "GoReleaser version (Renovate-maintained via the customManager in renovate.json)."
        required: false
        type: string
        # renovate: datasource=github-releases depName=goreleaser/goreleaser
        default: "v2.17.1"
      goreleaser-args:
        description: "Args passed to goreleaser. Default builds+publishes; pass --skip=docker for binary-only."
        required: false
        type: string
        default: "release --clean"
      install-cosign:
        description: "Install cosign so the config's signs:/docker_signs: blocks can keyless-sign."
        required: false
        type: boolean
        default: false
      cosign-version:
        description: "cosign release to install when install-cosign is true."
        required: false
        type: string
        default: "v3.0.6"
      pre-cmd:
        description: "Optional shell run before goreleaser (e.g. install syft/go-licenses, generate notices)."
        required: false
        type: string
        default: ""
      attest-provenance:
        description: "Attest SLSA build provenance for the released artifacts and attach it to the Release."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# Serialize per release tag but NEVER cancel — a half-built/half-uploaded release is
# worse than a slow one. (Mirrors container-publish: cancel edge, never a release.)
concurrency:
  group: binaries-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release-tag }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: goreleaser (binaries)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # upload binaries/checksums/SBOMs to the GitHub Release
      id-token: write # keyless cosign blob/image signing via GitHub OIDC
      packages: write # in case the config pushes anything to GHCR
      attestations: write # SLSA build provenance for the released artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-tag }} # build the exact commit release-please tagged
          fetch-depth: 0 # full history for the changelog/version
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && inputs.go-version-file || '' }}
          cache: false

      - name: Install cosign
        if: ${{ inputs.install-cosign }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ inputs.cosign-version }}

      # Optional pre-release step (tool installs, third-party notices, etc.). Passed via
      # env — never interpolate inputs directly into run: (zizmor template-injection).
      - name: Pre-release setup
        if: ${{ inputs.pre-cmd != '' }}
        env:
          PRE_CMD: ${{ inputs.pre-cmd }}
        run: bash -c "$PRE_CMD"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ inputs.goreleaser-version }}
          args: ${{ inputs.goreleaser-args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Locate the checksums file GoReleaser wrote. Attesting the CHECKSUMS rather than each
      # archive covers every listed artifact in one attestation, and keeps this agnostic to the
      # repo's archive naming. Config-dependent, so a repo without a checksum: block just skips.
      # Cosign writes signature bundles NEXT TO the checksums file (X_SHA256SUMS.sigstore.json,
      # .sig, .pem) that also match these globs, and find's ordering is unspecified — exclude
      # them and sort, or the attest step gets handed a signature bundle ("Invalid digest").
      - name: Locate checksums
        if: ${{ inputs.attest-provenance }}
        id: checksums
        run: |
          set -euo pipefail
          file=$(find dist -maxdepth 1 -type f \( -name '*SHA256SUMS*' -o -name '*checksums*' \) \
            ! -name '*.sigstore.json' ! -name '*.sig' ! -name '*.pem' ! -name '*.intoto.jsonl' \
            | sort | head -1)
          if [ -z "$file" ]; then
            echo "No checksums file in dist/ — skipping provenance." >&2
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=$file" >> "$GITHUB_OUTPUT"
          fi

      # SLSA build provenance over every artifact named in the checksums file. This records the
      # attestation with GitHub (verifiable via `gh attestation verify`), and the bundle is then
      # attached to the Release below so it is fetchable without the API — which is also what
      # OpenSSF Scorecard's Signed-Releases check reads (it looks for a .intoto.jsonl asset).
      - name: Attest build provenance
        if: ${{ inputs.attest-provenance && steps.checksums.outputs.path != '' }}
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: ${{ steps.checksums.outputs.path }}

      - name: Attach provenance to the Release
        if: ${{ inputs.attest-provenance && steps.attest.outputs.bundle-path != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          CHECKSUMS_PATH: ${{ steps.checksums.outputs.path }}
        run: |
          set -euo pipefail
          # Name the asset after the subject it attests, with the .intoto.jsonl extension that
          # identifies a DSSE-wrapped in-toto provenance statement.
          asset="$(basename "$CHECKSUMS_PATH").intoto.jsonl"
          cp "$BUNDLE_PATH" "$asset"
          gh release upload "$RELEASE_TAG" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
