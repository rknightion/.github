name: ac-evidence (reusable)

# Reusable pull request check: a pull request that closes an issue shows evidence for every acceptance
# criterion of that issue. Spec, caller snippet and PR template: docs/ac-evidence/README.md.
#
# The checker is NOT read from the caller's repository. It is checked out from this repository at
# job.workflow_sha, the commit of this workflow the caller named in `uses:`. That binds the checker to
# whatever the caller names; it does not stop a pull request from changing the caller. On a pull_request
# event the caller's workflow file comes from the PR head, so a PR can repoint `uses:` or stub a job with this
# name. The binding is enforced outside this file: the tracker's `tracker close --pr` accepts only a GitHub
# Actions run that references rknightion/.github/.github/workflows/ac-evidence.yml at a commit on this
# repo's main, and refuses a PR that changed .github/workflows or .github/actions. Make the check required in
# a branch ruleset so GitHub's own Closes-#N auto-close also waits for it. The caller's head commit is checked
# out only as the files a proof may cite, into its own directory beside the checker's, never around it, so
# nothing the pull request commits (a file or a symlink) can land on or redirect the checker.
#
# Only pull_request events are judged. Any other event fails the job loudly, because a skipped required
# check reports success.
#
# Caller permissions are mandatory (a called workflow is capped by its caller and validated at startup):
# contents: read, issues: read, pull-requests: read.
#
# Check run name: the caller's job name, " / ", then this job's name "Acceptance evidence".

on:
  workflow_call:
    inputs:
      enforce-all-prs:
        description: >-
          true: every pull request needs a Closes target with an evidence table, or "Task: none, <reason>".
          false: only a pull request whose body closes an issue is checked. Public repositories take outside
          and bot pull requests, so leave false there; a private repository with no outside contributors sets true.
        required: false
        type: boolean
        default: false
      release-please-author:
        description: >-
          Login of the release-please account whose oversized-release-notes placeholder body counts as
          "Task: none" on the release-please--branches--main branch. Empty never accepts it.
        required: false
        type: string
        default: ""
      runs-on:
        description: "Runner label."
        required: false
        type: string
        default: "ubuntu-latest"
      harden:
        description: "Deprecated, no effect: step-security/harden-runner is no longer run. Still accepted so callers that pass it keep starting."
        required: false
        type: boolean
        default: false
      node-version:
        description: >-
          Node for the checker, installed only when no Node 22 or newer is already on PATH (GitHub-hosted
          images ship one). The default is a version the fleet runner image already carries in its tool cache.
        required: false
        type: string
        default: "24.22.3"

permissions: {}

# A newer run on the same pull request supersedes an older one; the body is read live, so only the latest matters.
concurrency:
  group: ac-evidence-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ac-evidence:
    name: Acceptance evidence
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Refuse anything but a pull request
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "::error title=Acceptance evidence::this check judges pull_request events only, not ${EVENT_NAME}; call it from a pull_request trigger"
            exit 1
          fi

      # Check runs belong to a commit, not a pull request, so two pull requests at one head share them.
      # This annotation names the pull request this run judged; `tracker close --pr` requires it to match.
      - name: Record which pull request this run judges
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Acceptance evidence::the pull request number or head commit is malformed"
            exit 1
          fi
          echo "::notice title=Acceptance evidence binding::pr=${PR_NUMBER} head=${PR_HEAD_SHA}"

      # Enforcement off and no closing keyword anywhere in the live body: the checker would print "not
      # applicable" and pass, so stop before the two checkouts and the Node setup. The match is deliberately
      # wider than the checker's (any close/fix/resolve word, comments and prose included), so it only ever
      # skips a body the checker would also pass. Any failure to read the body runs the full check. The body
      # is untrusted: it goes to grep on stdin and is never echoed or put into a command.
      - name: Skip when nothing is enforced
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ENFORCE_ALL: ${{ inputs.enforce-all-prs }}
        run: |
          skip=false
          if [[ "$ENFORCE_ALL" == "false" ]] && gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.body // ""' > "${RUNNER_TEMP}/pr-body.txt"; then
            if ! grep -Eiq '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\b' "${RUNNER_TEMP}/pr-body.txt"; then
              skip=true
              echo "Acceptance evidence not applicable: no closing keyword in the pull request body and enforcement for every pull request is off."
            fi
          fi
          rm -f "${RUNNER_TEMP}/pr-body.txt"
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - name: Checkout the pull request head
        if: ${{ steps.scope.outputs.skip != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - name: Refuse to run without the pinned reusable commit
        if: ${{ steps.scope.outputs.skip != 'true' }}
        env:
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if ! [[ "$JOB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Acceptance evidence::job.workflow_sha is not a commit, so the pinned checker cannot be selected"
            exit 1
          fi

      # The checker comes from the commit of this reusable workflow the caller named, never from the caller's tree,
      # and sits beside the pull request tree (head/), not inside it.
      - name: Checkout the checker at the pinned reusable commit
        if: ${{ steps.scope.outputs.skip != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rknightion/.github
          ref: ${{ job.workflow_sha }}
          path: judge
          persist-credentials: false
          sparse-checkout: scripts/ac-evidence/ac-evidence-check.mjs
          sparse-checkout-cone-mode: false

      - name: Find a usable Node
        id: pathnode
        if: ${{ steps.scope.outputs.skip != 'true' }}
        run: |
          major="$(node --version 2>/dev/null | sed -n 's/^v\([0-9][0-9]*\)\..*/\1/p')"
          if [[ -n "$major" && "$major" -ge 22 ]]; then
            echo "Using Node $(node --version) from PATH"
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: ${{ steps.scope.outputs.skip != 'true' && steps.pathnode.outputs.reuse != 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Check the acceptance evidence
        if: ${{ steps.scope.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AC_EVIDENCE_ENFORCE_ALL_PRS: ${{ inputs.enforce-all-prs && 'true' || 'false' }}
          AC_EVIDENCE_RELEASE_AUTHOR: ${{ inputs.release-please-author }}
          AC_EVIDENCE_TREE: head
        run: node judge/scripts/ac-evidence/ac-evidence-check.mjs < /dev/null
