name: actionlint (reusable)

# Reusable correctness linter for GitHub Actions workflow YAML (expression types,
# wrong inputs, embedded shell via ShellCheck). Complements zizmor (security) and
# CodeQL's `actions` language (dataflow). Non-gating: reports problems, does not
# upload SARIF. actionlint and its Linux artifact checksum are pinned here.

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label. Any runner label."
        required: false
        type: string
        default: "ubuntu-latest"
      harden:
        description: >-
          Deprecated, no effect. harden-runner was removed from this workflow; the input stays so
          callers that still pass it keep starting.
        required: false
        type: boolean
        default: true

permissions: {}

# Cancel a superseded run on the same ref (rapid pushes / PR updates) to free runners.
# Unique group prefix per reusable so a caller invoking several reusables doesn't put
# them in one group where they'd cancel each other.
concurrency:
  group: actionlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Run actionlint
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Scope: on a pull request, read the PR file list through the API (no checkout) and skip the
      # heavy steps when no workflow, action or workflow-config file changed. The job still runs and reports, so a
      # required check stays satisfied. Fails closed: no gh, an API error, or a list that is
      # truncated (the API caps it at 3000 files) or does not match changed_files all run the full
      # check. push, schedule and dispatch runs are always complete.
      - name: Scope (skip when no workflow, action or workflow-config file changed)
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          RELEVANT: '^\.github/(workflows|actions)/|^\.github/actionlint\.ya?ml$|(^|/)action\.ya?ml$'
        run: |
          set -uo pipefail
          full() { echo "Running the full check: $1"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$EVENT" = pull_request ] || full "not a pull_request run"
          command -v gh >/dev/null 2>&1 || full "gh is not available"
          [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$CHANGED_FILES" =~ ^[0-9]+$ ]] || full "pull request metadata is missing"
          [ "$CHANGED_FILES" -lt 3000 ] || full "the file list is capped at 3000 files"
          listing=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | "\(.filename)\t\(.previous_filename // "")"') || full "the file list could not be read"
          count=$(printf '%s' "$listing" | grep -c '' || true)
          [ "$count" -eq "$CHANGED_FILES" ] || full "listed $count files, expected $CHANGED_FILES"
          if printf '%s\n' "$listing" | tr '\t' '\n' | grep -Eq "$RELEVANT"; then
            full "a relevant file changed"
          fi
          echo "No workflow, action or workflow-config file changed in this pull request: skipping the check."
          echo "run=false" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: ${{ steps.scope.outputs.run == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        if: ${{ steps.scope.outputs.run == 'true' }}
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          # actionlint 1.7.12 predates this official hosted runner (upstream #682).
          # Keep caller config intact and exempt only this exact label diagnostic.
          known_runner='^label "ubuntu-26\.04" is unknown\.'
          if command -v actionlint >/dev/null 2>&1; then
            installed_version="$(actionlint -version | sed -n '1{s/^v//;p;}')"
            if [ "${installed_version}" != "${ACTIONLINT_VERSION}" ]; then
              printf 'actionlint version mismatch: installed=%s expected=%s\n' \
                "${installed_version:-<unknown>}" "${ACTIONLINT_VERSION}" >&2
              exit 1
            fi
            actionlint -color -ignore "$known_runner"
          else
            if [ "${RUNNER_OS}" != "Linux" ] || [ "${RUNNER_ARCH}" != "X64" ]; then
              printf 'actionlint is not on PATH and no fallback artifact exists for os=%s arch=%s\n' \
                "${RUNNER_OS}" "${RUNNER_ARCH}" >&2
              exit 1
            fi
            archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
            curl \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 2 \
              --fail \
              --show-error \
              --silent \
              --location \
              --output "${archive}" \
              "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
            printf '%s  %s\n' "${ACTIONLINT_LINUX_AMD64_SHA256}" "${archive}" | sha256sum --check --strict
            tar -xzf "${archive}" actionlint
            ./actionlint -color -ignore "$known_runner"
          fi
