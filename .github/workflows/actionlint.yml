name: actionlint (reusable)

# Reusable correctness linter for GitHub Actions workflow YAML (expression types,
# wrong inputs, embedded shell via ShellCheck). Complements zizmor (security) and
# CodeQL's `actions` language (dataflow). Non-gating: reports problems, does not
# upload SARIF. actionlint and its Linux artifact checksum are pinned here.

on:
  workflow_call: {}

permissions: {}

# Cancel a superseded run on the same ref (rapid pushes / PR updates) to free runners.
# Unique group prefix per reusable so a caller invoking several reusables doesn't put
# them in one group where they'd cancel each other.
concurrency:
  group: actionlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Run actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            --fail \
            --show-error \
            --silent \
            --location \
            --output "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          printf '%s  %s\n' "${ACTIONLINT_LINUX_AMD64_SHA256}" "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" actionlint
          ./actionlint -color
