rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
  # self-repository asks for the `$/` same-repo `uses:` form, but the pinned
  # actionlint rejects `$/` as an invalid reusable workflow call, and `./` already
  # resolves at the caller's commit. Re-enable once the pinned actionlint parses `$/`.
  self-repository:
    disable: true
