# actionlint 1.7.12 predates the job.workflow_sha context property (the commit of the workflow file
# that defines the current job, so in a called reusable workflow its pinned commit). ac-evidence.yml,
# privacy-sweep.yml and pr-metadata.yml use it to run checkers from the caller's pinned commit.
# github.job_workflow_sha is not populated on runners (actions/runner#2417). Remove these exemptions
# once the pinned actionlint knows the property.
paths:
  .github/workflows/ac-evidence.yml:
    ignore:
      - 'property "workflow_sha" is not defined in object type'
  .github/workflows/changes.yml:
    ignore:
      - 'property "workflow_sha" is not defined in object type'
  .github/workflows/privacy-sweep.yml:
    ignore:
      - 'property "workflow_sha" is not defined in object type'
  .github/workflows/pr-metadata.yml:
    ignore:
      - 'property "workflow_sha" is not defined in object type'
