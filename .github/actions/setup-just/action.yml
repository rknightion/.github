name: Set up just
description: >-
  Install a pinned `just` command runner, so a workflow step can be a one-line
  `just <recipe>` call instead of carrying shell logic.

# The point of the wrapper is that the fleet's just VERSION is pinned in exactly
# one place. `just --fmt` output is explicitly outside just's semver
# compatibility guarantee, so an unpinned bump turns `just fmt-check` red across
# ~40 repos at once with no repo change to blame it on.

inputs:
  just-version:
    description: "Exact just version to install. Pin exactly; never a range."
    required: false
    # renovate: datasource=github-releases depName=casey/just
    default: "1.59.0"
  github-token:
    description: >-
      Retained for compatibility; public release downloads do not use a token.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # Enforce the "pin exactly" contract: a range, "latest" or an empty value
    # would let the installer float to whatever release is newest.
    - name: Check the just version is an exact pin
      shell: bash
      env:
        JUST_VERSION: ${{ inputs.just-version }}
      run: |
        [[ "$JUST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
          # The value is caller-supplied and runs through a line-based command
          # parser: encode it as the runner does for command data so a newline
          # or carriage return cannot start a second workflow command.
          # Patterns are held in variables so the expansion also behaves on macOS bash 3.2.
          pct='%'; cr=$'\r'; nl=$'\n'
          shown=${JUST_VERSION//"$pct"/%25}
          shown=${shown//"$cr"/%0D}
          shown=${shown//"$nl"/%0A}
          echo "::error::just-version must be an exact X.Y.Z version, got '${shown}'"
          exit 1
        }
    - name: Install verified just release
      id: install
      shell: bash
      env:
        JUST_VERSION: ${{ inputs.just-version }}
      run: |
        case "$RUNNER_OS" in
          Linux) platform=unknown-linux-musl ;;
          macOS) platform=apple-darwin ;;
          *) echo "::error::Unsupported runner OS: $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch=x86_64 ;;
          ARM64) arch=aarch64 ;;
          *) echo "::error::Unsupported runner architecture: $RUNNER_ARCH"; exit 1 ;;
        esac
        asset="just-${JUST_VERSION}-${arch}-${platform}.tar.gz"
        url="https://github.com/casey/just/releases/download/${JUST_VERSION}"
        runner_temp=$(cd "$RUNNER_TEMP" && pwd -P)
        case "$runner_temp" in
          *$'\n'*|*$'\r'*) echo "::error::Runner temporary path contains a newline"; exit 1 ;;
        esac
        install_dir=$(mktemp -d "${runner_temp}/setup-just.XXXXXXXX")
        trap 'rm -rf -- "$install_dir"' EXIT
        cd "$install_dir"
        if ! curl --retry 5 --retry-all-errors --retry-delay 2 --fail --location \
          --output "$asset" "$url/$asset"; then
          echo "::error::Failed to download $asset"
          exit 1
        fi
        if ! curl --retry 5 --retry-all-errors --retry-delay 2 --fail --location \
          --output SHA256SUMS "$url/SHA256SUMS"; then
          echo "::error::Failed to download SHA256SUMS for just $JUST_VERSION"
          exit 1
        fi
        awk -v asset="$asset" '$2 == asset { print }' SHA256SUMS > selected.sha256
        if [[ $(wc -l < selected.sha256) -ne 1 ]]; then
          echo "::error::Expected exactly one checksum for $asset"
          exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c selected.sha256
        else
          shasum -a 256 -c selected.sha256
        fi
        tar -xzf "$asset" just
        if ! installed_version=$("$install_dir/just" --version); then
          echo "::error::Downloaded just failed to report its version"
          exit 1
        fi
        if [[ "$installed_version" != "just $JUST_VERSION" ]]; then
          echo "::error::Downloaded just reports an unexpected version"
          exit 1
        fi
        echo "$installed_version"
        rm -f -- "$asset" SHA256SUMS selected.sha256
        printf 'path=%s\n' "$install_dir" >> "$GITHUB_OUTPUT"
        trap - EXIT
    - name: Add just to PATH
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        JUST_INSTALL_DIR: ${{ steps.install.outputs.path }}
      with:
        # github-script requires a nonempty token even when no API is called.
        github-token: unused
        script: |
          core.addPath(process.env.JUST_INSTALL_DIR)
