name: OpenBao GitHub App token broker
description: >-
  Mint a short-lived, permission-scoped GitHub App installation token from the
  OpenBao broker on camden, with no long-lived secret stored in the repo.

# HOW THIS REPLACES A STORED PAT
#
#   GitHub OIDC token  --(workload identity federation)-->  ephemeral tailnet node (tag:gha)
#   GitHub OIDC token  --(auth/gha JWT role)-------------->  short-lived OpenBao token
#   OpenBao token      --(permission set)----------------->  scoped ghs_ installation token
#
# Nothing durable is stored in the consuming repo. TS_WIF_CLIENT_ID and
# TS_WIF_AUDIENCE are IDENTIFIERS, not credentials: possession of either grants
# nothing without a GitHub-signed OIDC token whose claims match the federated
# identity. There is one federated identity per owner -- rknightion 12484127,
# brewmdm 312016889, m7kni 278668071 -- and the App is installed on all three,
# so a permission set names the installation its repositories belong to.
#
# On a runner that already has tailnet access, pass join-tailnet: "false" and
# skip both identifiers entirely; nothing at all is then stored in the repo.
#
# AVAILABILITY: this makes the calling workflow depend on camden being up,
# unsealed, and on the tailnet. A camden outage fails releases rather than
# silently degrading them, which is the intended trade -- but it IS a new
# dependency for public-repo CI, so treat a failure here as infrastructure
# rather than as a problem with the PR.
#
# The caller MUST set `permissions: id-token: write` on the job, or the OIDC
# token request returns nothing and this action fails at the first step.

inputs:
  permission-set:
    description: >-
      Name of the OpenBao permission set to mint from, e.g.
      release-please-<repo>. The ACL policy is `gha-<this name>`. The JWT role
      usually shares this name too -- but not always, so see `role` below.
    required: true
  role:
    description: >-
      auth/gha JWT role to log in as. Defaults to `permission-set`, which is the
      right answer whenever a permission set has exactly one consuming repo.
      Pass it explicitly when they diverge: docs-sync shares ONE permission set
      across every consumer (they all dispatch at the same hub) but needs a role
      per repo to pin repository_id, so the names cannot match.
    required: false
    default: ""
  bao-addr:
    description: OpenBao address (tailnet-only).
    required: false
    default: https://openbao.saga-turtle.ts.net
  tailscale-client-id:
    description: >-
      Tailscale federated identity client ID (an identifier, not a secret).
      Not required when join-tailnet is false.
    required: false
    default: ""
  tailscale-audience:
    description: >-
      Tailscale federated identity audience (an identifier, not a secret).
      Not required when join-tailnet is false.
    required: false
    default: ""
  resolve-via:
    description: >-
      Hostname to resolve in order to reach OpenBao when NOT joining the tailnet
      -- for in-cluster runners this is the Tailscale operator's egress Service,
      e.g. openbao.tailscale.svc.cluster.local. The action resolves it and pins
      it with `curl --resolve` against OpenBao's real ts.net name, so the TLS
      SAN still validates. Ignored when join-tailnet is true, and unnecessary on
      a runner that already resolves the ts.net name through ambient DNS.
    required: false
    default: ""
  join-tailnet:
    description: >-
      Whether to join the tailnet. Set to 'false' on self-hosted runners that
      are ALREADY on the tailnet -- brewmdm's arc-arm64 runners in EKS are (via
      the operator egress proxy, so pass resolve-via too), and the `runners` VM
      and macos-mbp14 resolve OpenBao through ambient DNS with neither input.
      GitHub-hosted runners must leave this true.
    required: false
    default: "true"

outputs:
  token:
    description: >-
      The GitHub App installation token. Registered with ::add-mask:: before it
      is ever emitted, so it is redacted in logs -- but it is still a live
      credential, so do not write it to an artifact or a file the job uploads.
    value: ${{ steps.mint.outputs.token }}

runs:
  using: composite
  steps:
    - name: Join the tailnet
      if: inputs.join-tailnet == 'true'
      uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
      with:
        oauth-client-id: ${{ inputs.tailscale-client-id }}
        audience: ${{ inputs.tailscale-audience }}
        tags: tag:gha
        # --accept-dns=false is LOAD-BEARING, not a tidy-up.
        #
        # This tailnet's global nameserver is 10.0.0.254 (OPNsense), and
        # tag:gha is granted OpenBao on :443 and nothing else -- so accepting
        # tailnet DNS points the runner at a resolver it is not allowed to
        # reach, and EVERY public name stops resolving the moment it joins.
        # That breaks api.github.com, which is the whole point of the token
        # being minted. Observed as `curl: (6) Could not resolve host:
        # pkgs.tailscale.com` in run 31250275443.
        #
        # The alternative -- granting tag:gha DNS to 10.0.0.254 -- would also
        # work, but it puts OPNsense on the critical path for resolving
        # api.github.com from public-repo CI. Keeping the runner's own resolver
        # is both tighter on network grants and one less availability link.
        args: --accept-dns=false

    - name: Work out how to reach OpenBao
      # Produces a `curl --resolve` argument rather than editing /etc/hosts:
      # runner pods have no root and no sudo, and --resolve pins the address
      # while still presenting the ts.net NAME for TLS, so the certificate's
      # SAN check passes either way. Never disable certificate verification to
      # work around this.
      shell: bash
      env:
        BAO_ADDR: ${{ inputs.bao-addr }}
        JOIN_TAILNET: ${{ inputs.join-tailnet }}
        RESOLVE_VIA: ${{ inputs.resolve-via }}
      run: |
        set -euo pipefail
        host=${BAO_ADDR#https://}
        if [ "$JOIN_TAILNET" = "true" ]; then
          # We joined with --accept-dns=false, so MagicDNS will not resolve the
          # name. tailscaled's peer list does not depend on DNS.
          ip=$(tailscale ip -4 openbao)
        elif [ -n "$RESOLVE_VIA" ]; then
          ip=$(getent hosts "$RESOLVE_VIA" | head -1 | awk '{print $1}')
          [ -n "$ip" ] || { echo "::error::could not resolve ${RESOLVE_VIA}"; exit 1; }
        else
          echo "BAO_RESOLVE=" >> "$GITHUB_ENV"
          echo "no address pinning; relying on ambient DNS for ${host}"
          exit 0
        fi
        echo "BAO_RESOLVE=--resolve ${host}:443:${ip}" >> "$GITHUB_ENV"
        echo "pinned ${host} -> ${ip}"

    - name: Mint a scoped installation token
      id: mint
      shell: bash
      env:
        BAO_ADDR: ${{ inputs.bao-addr }}
        PERMISSION_SET: ${{ inputs.permission-set }}
        BAO_ROLE: ${{ inputs.role || inputs.permission-set }}
      run: |
        set -euo pipefail
        tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT

        # `curl --fail-with-body` would be the obvious way to surface an error
        # body on a 4xx, but it needs curl >= 7.76 and NOT every runner has it:
        # rkps-awsinfra's self-hosted jobs run in a container whose curl rejects
        # the flag outright (`option --fail-with-body: is unknown`), which then
        # surfaces as an unrelated-looking JSON decode error on empty input.
        # Capturing the status code with -w is portable to every curl.
        req() { # req <outfile> <what> <curl args...>
          local out=$1 what=$2; shift 2
          local code
          code=$(curl -sS -o "$out" -w '%{http_code}' "$@")
          if [ "$code" -ge 400 ]; then
            echo "::error::${what} returned HTTP ${code}"
            cat "$out" >&2 || true
            return 1
          fi
        }

        # ::add-mask:: is LINE-BASED: given a multi-line value it registers only
        # the first line and ECHOES THE REST TO THE LOG AS PLAIN OUTPUT. Every
        # value masked here is a single-line token by construction, but "by
        # construction" is what the sibling action also assumed right up until it
        # printed an RSA private key into a log (2026-08-08). So assert it rather
        # than assume it: refuse to emit anything that could leak, and name only
        # the label, never the value.
        mask() { # mask <label> <value>
          case $2 in
            *$'\n'*) echo "::error::$1 is multi-line; refusing to emit a mask that would leak it"; return 1 ;;
            '')      echo "::error::$1 is empty"; return 1 ;;
          esac
          printf '::add-mask::%s\n' "$2"
        }

        # A second OIDC token, with OpenBao's audience rather than Tailscale's.
        # GitHub issues a fresh token per audience; reusing the Tailscale one
        # would fail OpenBao's bound_audiences check.
        req "$tmp/jwt.json" "the GitHub OIDC token request" \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${BAO_ADDR}"
        gh_jwt=$(python3 -c 'import sys,json; print(json.load(open(sys.argv[1]))["value"])' "$tmp/jwt.json")

        # Exchange it for an OpenBao token. The role's bound_claims pin the repo,
        # so a job in another repo presenting a perfectly valid GitHub OIDC token
        # is rejected HERE, not merely limited later.
        #
        # A 400 from this endpoint usually means the role does not exist, which
        # is what happens if you assume the role name always equals the
        # permission-set name. It does not for docs-sync.
        printf '%s' "$gh_jwt" > "$tmp/jwt.txt"
        python3 -c 'import json,os,sys; print(json.dumps({"role": os.environ["BAO_ROLE"], "jwt": open(sys.argv[1]).read().strip()}))' \
          "$tmp/jwt.txt" > "$tmp/login.json"
        req "$tmp/auth.json" "auth/gha/login" \
          ${BAO_RESOLVE} -X POST "${BAO_ADDR}/v1/auth/gha/login" \
          -H 'Content-Type: application/json' --data-binary @"$tmp/login.json"
        bao_token=$(python3 -c 'import sys,json; print(json.load(open(sys.argv[1]))["auth"]["client_token"])' "$tmp/auth.json")
        mask "the OpenBao token" "$bao_token"

        req "$tmp/token.json" "the token mint" \
          ${BAO_RESOLVE} -H "X-Vault-Token: ${bao_token}" \
          -X POST "${BAO_ADDR}/v1/github-app-broker/token/${PERMISSION_SET}"

        gh_token=$(python3 -c 'import sys,json; print(json.load(open(sys.argv[1]))["data"]["token"])' "$tmp/token.json")
        # Mask BEFORE the value can reach any later log line.
        mask "the installation token" "$gh_token"
        echo "token=${gh_token}" >> "$GITHUB_OUTPUT"

        # Report what was granted, so a permissions problem downstream is
        # diagnosable without minting a second token to inspect by hand.
        python3 -c 'import sys,json; d=json.load(open(sys.argv[1]))["data"]; print("minted for repositories:", d.get("repositories")); print("permissions:", d.get("permissions")); print("expires_at:", d.get("expires_at"))' "$tmp/token.json"
