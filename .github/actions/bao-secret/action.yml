name: Read secrets from OpenBao
description: >-
  Read a KV v2 secret from OpenBao on camden into masked step outputs, with no
  long-lived credential stored in the repository.

# Sibling of broker-token. Same auth path -- GitHub OIDC -> Tailscale workload
# identity federation -> auth/gha JWT role -- but it reads generic KV secrets
# instead of minting a GitHub App installation token. This is the shape the
# macOS signing workflow needs (certificate, notary password, Sparkle key).
#
# Works for both the rknightion account and the brewmdm org; each has its own
# federated identity pinned to its numeric owner id, and the role name selects
# which OpenBao policy applies.
#
# AVAILABILITY: the calling workflow now depends on camden being up, unsealed
# and on the tailnet. A failure here is infrastructure, not the commit.
#
# The caller MUST set `permissions: id-token: write`.

inputs:
  role:
    description: >-
      auth/gha JWT role to log in as. Its bound_claims pin the calling repo, so
      a job elsewhere presenting a valid OIDC token is rejected at login.
    required: true
  path:
    description: >-
      KV v2 secret path WITHOUT the mount's `data/` segment, e.g.
      brewmdm/website. The action inserts `data/` itself.
    required: true
  mount:
    description: KV v2 mount point.
    required: false
    default: secret
  bao-addr:
    description: OpenBao address (tailnet-only).
    required: false
    default: https://openbao.saga-turtle.ts.net
  tailscale-client-id:
    description: Tailscale federated identity client ID (an identifier, not a secret).
    required: true
  tailscale-audience:
    description: Tailscale federated identity audience (an identifier, not a secret).
    required: true

outputs:
  keys:
    description: >-
      Space-separated list of the keys that were read. The VALUES are exported
      as masked environment variables named after each key, uppercased -- they
      are deliberately not step outputs, so they cannot be interpolated into a
      later `run:` block by accident.
    value: ${{ steps.read.outputs.keys }}

runs:
  using: composite
  steps:
    - name: Join the tailnet
      uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
      with:
        oauth-client-id: ${{ inputs.tailscale-client-id }}
        audience: ${{ inputs.tailscale-audience }}
        tags: tag:gha
        # See broker-token: this tailnet's nameserver is 10.0.0.254, which
        # tag:gha may not reach, so accepting tailnet DNS breaks every public
        # name the moment the runner joins.
        args: --accept-dns=false

    - name: Resolve OpenBao without tailnet DNS
      shell: bash
      env:
        BAO_ADDR: ${{ inputs.bao-addr }}
      run: |
        set -euo pipefail
        host=${BAO_ADDR#https://}
        ip=$(tailscale ip -4 openbao)
        echo "${ip} ${host}" | sudo tee -a /etc/hosts >/dev/null

    - name: Read the secret
      id: read
      shell: bash
      env:
        BAO_ADDR: ${{ inputs.bao-addr }}
        BAO_ROLE: ${{ inputs.role }}
        KV_MOUNT: ${{ inputs.mount }}
        KV_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail

        gh_jwt=$(curl -sS --fail-with-body \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${BAO_ADDR}" \
          | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')

        bao_token=$(curl -sS --fail-with-body \
          -X POST "${BAO_ADDR}/v1/auth/gha/login" \
          -H 'Content-Type: application/json' \
          --data-binary "$(python3 -c 'import json,os,sys; print(json.dumps({"role": os.environ["BAO_ROLE"], "jwt": sys.stdin.read().strip()}))' <<<"$gh_jwt")" \
          | python3 -c 'import sys,json; print(json.load(sys.stdin)["auth"]["client_token"])')
        echo "::add-mask::${bao_token}"

        # KV v2 reads go through <mount>/data/<path>; the CLI hides that but the
        # HTTP API does not, and omitting it is the classic KV v2 mistake.
        curl -sS --fail-with-body -H "X-Vault-Token: ${bao_token}" \
          "${BAO_ADDR}/v1/${KV_MOUNT}/data/${KV_PATH}" > /tmp/bao-kv.json

        # Mask every value BEFORE anything else can echo one, then export each
        # as an env var. Values never become step outputs: step outputs persist
        # in the workflow's object graph and are easy to interpolate somewhere
        # that gets logged, whereas env vars stay scoped to the job.
        # stdout is NOT redirected here on purpose: ::add-mask:: has to reach
        # the log stream to take effect, so the env and output files are
        # written directly rather than by shell redirection.
        python3 - <<'PY'
        import json, os
        d = json.load(open('/tmp/bao-kv.json'))['data']['data']
        names = []
        with open(os.environ['GITHUB_ENV'], 'a') as env:
            for k, v in d.items():
                v = str(v)
                print(f"::add-mask::{v}", flush=True)
                for line in v.splitlines():          # mask each line too, so a
                    if line.strip():                 # multi-line PEM cannot leak
                        print(f"::add-mask::{line}", flush=True)
                name = k.upper().replace('-', '_')
                names.append(name)
                # Heredoc form so multi-line values (PEM keys, certs) survive.
                env.write(f"{name}<<__BAO_EOF__\n{v}\n__BAO_EOF__\n")
        with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
            out.write("keys=" + " ".join(names) + "\n")
        print(f"read {len(names)} key(s): {' '.join(names)}")
        PY
        rm -f /tmp/bao-kv.json
