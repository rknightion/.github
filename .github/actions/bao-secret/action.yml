name: Read secrets from OpenBao
description: >-
  Read a KV v2 secret from OpenBao on camden into masked step outputs, with no
  long-lived credential stored in the repository.

# Sibling of broker-token. Same auth path -- GitHub OIDC -> Tailscale workload
# identity federation -> auth/gha JWT role -- but it reads generic KV secrets
# instead of minting a GitHub App installation token. This is the shape the
# macOS signing workflow needs (certificate, notary password, Sparkle key).
#
# Works for both the rknightion account and the brewmdm org; each has its own
# federated identity pinned to its numeric owner id, and the role name selects
# which OpenBao policy applies.
#
# AVAILABILITY: the calling workflow now depends on camden being up, unsealed
# and on the tailnet. A failure here is infrastructure, not the commit.
#
# The caller MUST set `permissions: id-token: write`.

inputs:
  role:
    description: >-
      auth/gha JWT role to log in as. Its bound_claims pin the calling repo, so
      a job elsewhere presenting a valid OIDC token is rejected at login.
    required: true
  path:
    description: >-
      KV v2 secret path WITHOUT the mount's `data/` segment, e.g.
      brewmdm/website. The action inserts `data/` itself.
    required: true
  mount:
    description: KV v2 mount point.
    required: false
    default: secret
  bao-addr:
    description: OpenBao address (tailnet-only).
    required: false
    default: https://openbao.saga-turtle.ts.net
  tailscale-client-id:
    description: >-
      Tailscale federated identity client ID (an identifier, not a secret).
      Not required when join-tailnet is false.
    required: false
    default: ""
  tailscale-audience:
    description: >-
      Tailscale federated identity audience (an identifier, not a secret).
      Not required when join-tailnet is false.
    required: false
    default: ""
  resolve-via:
    description: >-
      Hostname to resolve in order to reach OpenBao when NOT joining the tailnet
      -- for in-cluster runners this is the Tailscale operator's egress Service,
      e.g. openbao.tailscale.svc.cluster.local. The action resolves it and pins
      it with `curl --resolve` against OpenBao's real ts.net name, so the TLS
      SAN still validates. Ignored when join-tailnet is true.
    required: false
    default: ""
  join-tailnet:
    description: >-
      Whether to join the tailnet. Set to 'false' on self-hosted runners that
      are ALREADY on the tailnet -- brewmdm's arc-arm64 runners in EKS are, and
      they cannot join anyway: tailscaled needs privileges a runner pod does
      not have. GitHub-hosted runners must leave this true.
    required: false
    default: "true"

outputs:
  keys:
    description: >-
      Space-separated list of the keys that were read. The VALUES are exported
      as masked environment variables named after each key, uppercased -- they
      are deliberately not step outputs, so they cannot be interpolated into a
      later `run:` block by accident.
    value: ${{ steps.read.outputs.keys }}

runs:
  using: composite
  steps:
    - name: Join the tailnet
      if: inputs.join-tailnet == 'true'
      uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
      with:
        oauth-client-id: ${{ inputs.tailscale-client-id }}
        audience: ${{ inputs.tailscale-audience }}
        tags: tag:gha
        # See broker-token: this tailnet's nameserver is 10.0.0.254, which
        # tag:gha may not reach, so accepting tailnet DNS breaks every public
        # name the moment the runner joins.
        args: --accept-dns=false

    - name: Work out how to reach OpenBao
      # Produces a `curl --resolve` argument rather than editing /etc/hosts:
      # runner pods have no root and no sudo, and --resolve pins the address
      # while still presenting the ts.net NAME for TLS, so the certificate's
      # SAN check passes either way. Never disable certificate verification to
      # work around this.
      shell: bash
      env:
        BAO_ADDR: ${{ inputs.bao-addr }}
        JOIN_TAILNET: ${{ inputs.join-tailnet }}
        RESOLVE_VIA: ${{ inputs.resolve-via }}
      run: |
        set -euo pipefail
        host=${BAO_ADDR#https://}
        if [ "$JOIN_TAILNET" = "true" ]; then
          # We joined with --accept-dns=false, so MagicDNS will not resolve the
          # name. tailscaled's peer list does not depend on DNS.
          ip=$(tailscale ip -4 openbao)
        elif [ -n "$RESOLVE_VIA" ]; then
          # getent exits 2 when the host is absent. Keep that failure from
          # set -e so the guard below can name the unresolved host, while
          # clearing any partial output keeps this path fail-closed.
          if ! ip=$(getent hosts "$RESOLVE_VIA" | head -1 | awk '{print $1}'); then
            ip=
          fi
          [ -n "$ip" ] || { echo "::error::could not resolve ${RESOLVE_VIA}"; exit 1; }
        else
          echo "BAO_RESOLVE=" >> "$GITHUB_ENV"
          echo "no address pinning; relying on ambient DNS for ${host}"
          exit 0
        fi
        echo "BAO_RESOLVE=--resolve ${host}:443:${ip}" >> "$GITHUB_ENV"
        echo "pinned ${host} -> ${ip}"

    - name: Read the secret
      id: read
      shell: bash
      env:
        BAO_ADDR: ${{ inputs.bao-addr }}
        BAO_ROLE: ${{ inputs.role }}
        KV_MOUNT: ${{ inputs.mount }}
        KV_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
        export BAO_SUMMARY="$tmp/summary"

        # `curl --fail-with-body` needs curl >= 7.76 and NOT every runner has
        # it: rkps-awsinfra's self-hosted jobs run in a container whose curl
        # rejects the flag outright (`option --fail-with-body: is unknown`),
        # which then surfaces as an unrelated-looking JSON decode error on empty
        # input. Capturing the status code with -w is portable to every curl.
        req() { # req <outfile> <what> <curl args...>
          local out=$1 what=$2; shift 2
          local code
          code=$(curl -sS -o "$out" -w '%{http_code}' "$@")
          if [ "$code" -ge 400 ]; then
            echo "::error::${what} returned HTTP ${code}"
            cat "$out" >&2 || true
            return 1
          fi
        }

        req "$tmp/jwt.json" "the GitHub OIDC token request" \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${BAO_ADDR}"
        gh_jwt=$(python3 -c 'import sys,json; print(json.load(open(sys.argv[1]))["value"])' "$tmp/jwt.json")

        printf '%s' "$gh_jwt" > "$tmp/jwt.txt"
        python3 -c 'import json,os,sys; print(json.dumps({"role": os.environ["BAO_ROLE"], "jwt": open(sys.argv[1]).read().strip()}))' \
          "$tmp/jwt.txt" > "$tmp/login.json"
        req "$tmp/auth.json" "auth/gha/login" \
          ${BAO_RESOLVE} -X POST "${BAO_ADDR}/v1/auth/gha/login" \
          -H 'Content-Type: application/json' --data-binary @"$tmp/login.json"
        bao_token=$(python3 -c 'import sys,json; print(json.load(open(sys.argv[1]))["auth"]["client_token"])' "$tmp/auth.json")
        echo "::add-mask::${bao_token}"

        # KV v2 reads go through <mount>/data/<path>; the CLI hides that but the
        # HTTP API does not, and omitting it is the classic KV v2 mistake.
        req /tmp/bao-kv.json "the KV read" ${BAO_RESOLVE} \
          -H "X-Vault-Token: ${bao_token}" \
          "${BAO_ADDR}/v1/${KV_MOUNT}/data/${KV_PATH}"

        # Export each value as a masked env var. Values never become step
        # outputs: step outputs persist in the workflow's object graph and are
        # easy to interpolate somewhere that gets logged, whereas env vars stay
        # scoped to the job.
        #
        # ☠️ WHY THIS IS SHAPED SO DEFENSIVELY -- a real leak, 2026-08-08.
        #
        # `::add-mask::` is a workflow COMMAND the runner parses out of the log
        # stream. There is no file-based equivalent (unlike GITHUB_ENV and
        # GITHUB_OUTPUT), so the value genuinely has to cross stdout. And the
        # command is LINE-BASED: handed a multi-line value it registers only the
        # FIRST line as a secret and echoes every remaining line to the log as
        # ordinary output.
        #
        # An earlier version printed the whole value and masked line-by-line
        # afterwards, so an RSA private key's body reached the log in cleartext
        # before anything masked it. Every secret handled until then happened to
        # be single-line base64, so it stayed invisible until the first PEM.
        #
        # Getting the print order right is necessary but NOT sufficient -- it
        # leaves the next edit one stray print() away from the same bug. So the
        # log stream is closed off structurally instead:
        #
        #   1. The generator's stdout is captured to a FILE. Nothing it writes
        #      can reach the log, whatever anyone changes it to print later.
        #   2. Every captured line is then checked to be a single, well-formed
        #      ::add-mask:: command. A line that is not is a value that escaped,
        #      so the step FAILS -- reporting the count only, never the content.
        #   3. Only the vetted lines are emitted.
        #
        # The worst a future bug can now do is fail the step. It cannot print.
        python3 - > "$tmp/masks" <<'PY'
        import json, os
        d = json.load(open('/tmp/bao-kv.json'))['data']['data']
        names = []
        with open(os.environ['GITHUB_ENV'], 'a') as env:
            for k, v in d.items():
                v = str(v)
                # One command per LINE, always -- never the whole value when it
                # spans more than one, since that is the leak.
                for line in v.splitlines():
                    if line.strip():
                        print(f"::add-mask::{line}")
                name = k.upper().replace('-', '_')
                names.append(name)
                # Heredoc form so multi-line values (PEM keys, certs) survive.
                env.write(f"{name}<<__BAO_EOF__\n{v}\n__BAO_EOF__\n")
        with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
            out.write("keys=" + " ".join(names) + "\n")
        # The summary goes to a file too; the shell prints it after vetting.
        with open(os.environ['BAO_SUMMARY'], 'w') as s:
            s.write("read %d key(s): %s\n" % (len(names), " ".join(names)))
        PY

        # Anything that is not exactly one ::add-mask::<non-empty> line is a
        # value that escaped the generator. Fail loudly, print only the count.
        stray=$(grep -cv '^::add-mask::.' "$tmp/masks" || true)
        if [ "${stray:-0}" -ne 0 ]; then
          echo "::error::secret reader produced ${stray} unexpected output line(s); refusing to emit them"
          exit 1
        fi
        cat "$tmp/masks"          # every line here is a command the runner consumes
        cat "$BAO_SUMMARY"        # key NAMES only, no values
        rm -f /tmp/bao-kv.json
